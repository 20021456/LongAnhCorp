<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sửa: Quy trình QC · Long Anh Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel" src="page-edit-shell.jsx"></script>
<script type="text/babel">
  const style = document.createElement('style');
  style.textContent = ADMIN_GLOBAL_CSS + PAGE_EDIT_CSS;
  document.head.appendChild(style);

  function PageEditQc() {
    const [lang, setLang] = React.useState('vi');
    const [status, setStatus] = React.useState('sched');

    const STEPS = [
      { name: 'Đầu vào — Đá nguyên liệu',
        body: 'Lấy mẫu mỗi xe đá vôi nhập kho. Kiểm tra độ trắng, hàm lượng CaCO₃, độ cứng và tạp chất.' },
      { name: 'Trong quá trình — Nghiền & phủ',
        body: 'Đo cỡ hạt online, tỉ lệ Stearic, độ ẩm. Kiểm tra mỗi 2 giờ và tự động dừng máy nếu lệch.' },
      { name: 'Đầu ra — Trước khi đóng gói',
        body: 'Lấy mẫu lô (1 mẫu / 25 tấn). Kiểm tra full chỉ tiêu — phát hành COA và lưu mẫu lưu 12 tháng.' },
      { name: 'Sau xuất hàng — Theo dõi',
        body: 'Mỗi container được mã hóa. Khi có khiếu nại, có thể truy vết về lô đá nguyên liệu trong vòng 30 phút.' },
    ];

    const PARAMS = [
      ['Độ trắng (L*)', '≥ 96', 'Spectrophotometer', 'Mỗi lô'],
      ['CaCO₃', '≥ 98.5%', 'Titration EDTA', 'Mỗi lô'],
      ['Cỡ hạt D50', 'Theo spec', 'Laser Mastersizer', 'Online + lô'],
      ['Độ ẩm', '≤ 0.3%', 'Lò sấy 105°C', 'Mỗi 2h'],
      ['Tỉ lệ Stearic', '1.0–1.5%', 'Soxhlet extraction', 'Mỗi lô coated'],
      ['Tỉ trọng đổ', '0.9–1.1', 'Bulk density meter', 'Mỗi lô'],
    ];

    const EQUIPMENT = [
      { name: 'Mastersizer 3000', vendor: 'Malvern Panalytical (UK)', purpose: 'Đo phân bố cỡ hạt' },
      { name: 'Spectrophotometer CM-5', vendor: 'Konica Minolta (JP)', purpose: 'Đo độ trắng L*a*b*' },
      { name: 'X-Ray Fluorescence', vendor: 'Bruker (DE)', purpose: 'Phân tích thành phần hóa học' },
      { name: 'Karl Fischer Titrator', vendor: 'Mettler Toledo (CH)', purpose: 'Đo độ ẩm chính xác' },
    ];

    return (
      <PeEditorShell
        active="pages"
        crumb={[
          { label: 'Trang chủ', href: 'index.html' },
          { label: 'Trang', href: 'pages.html' },
          { label: 'Quy trình QC' },
        ]}
        title="Quy trình QC"
        slug="/quy-trinh-qc"
        status={status} setStatus={setStatus}
        previewHref="#"
        lang={lang} setLang={setLang}>

        {/* 01 — Page header */}
        <PeSection num="01" icon="layers" title="Page header — Banner trang"
                   sub="Eyebrow, tiêu đề, mô tả">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="// Quality Control · 03" /></AdField>
              <AdField label="Tiêu đề chính" req>
                <input className="ad-input" defaultValue="Mỗi lô — kiểm tra. Mỗi container — truy vết." />
              </AdField>
            </div>
            <AdField label="Mô tả ngắn">
              <textarea className="ad-textarea" defaultValue="Phòng QC nội bộ vận hành 24/7 — đảm bảo độ trắng, CaCO₃, cỡ hạt và độ ẩm của mọi lô sản phẩm trước khi xuất xưởng." />
            </AdField>
          </div>
        </PeSection>

        {/* 02 — Process steps */}
        <PeSection num="02" icon="trend" title="4 bước quy trình QC"
                   sub="Đầu vào → Trong quá trình → Đầu ra → Sau xuất hàng">
          <div className="pe-stack">
            {STEPS.map((s, i) => (
              <div key={i} className="pe-card-edit">
                <div className="head">
                  <span className="pill">STEP 0{i + 1}</span>
                  <div className="name">{s.name}</div>
                  <button title="Kéo"><AdIcon name="drag" size={14} /></button>
                  <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                </div>
                <AdField label="Tên bước"><input className="ad-input" defaultValue={s.name} /></AdField>
                <AdField label="Mô tả"><textarea className="ad-textarea" defaultValue={s.body} style={{ minHeight: 60 }} /></AdField>
              </div>
            ))}
            <button className="ad-btn" style={{ width: 'fit-content' }}>
              <AdIcon name="plus" size={13} /> Thêm bước
            </button>
          </div>
        </PeSection>

        {/* 03 — Parameters */}
        <PeSection num="03" icon="list" title="Thông số kiểm tra"
                   sub="Bảng các chỉ tiêu, phương pháp đo và tần suất">
          <div className="pe-stack">
            <div className="pe-list">
              {PARAMS.map((p, i) => (
                <div key={i} className="pe-list-item">
                  <span className="num">{i + 1}</span>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 0.8fr 1.2fr 0.8fr', gap: 8 }}>
                    <input className="ad-input" defaultValue={p[0]} placeholder="Chỉ tiêu" />
                    <input className="ad-input" defaultValue={p[1]} placeholder="Yêu cầu" />
                    <input className="ad-input" defaultValue={p[2]} placeholder="Phương pháp" />
                    <input className="ad-input" defaultValue={p[3]} placeholder="Tần suất" />
                  </div>
                  <div className="actions">
                    <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                  </div>
                </div>
              ))}
            </div>
            <button className="ad-btn" style={{ width: 'fit-content' }}>
              <AdIcon name="plus" size={13} /> Thêm chỉ tiêu
            </button>
          </div>
        </PeSection>

        {/* 04 — Lab equipment */}
        <PeSection num="04" icon="settings" title="Thiết bị phòng thí nghiệm"
                   sub="Máy móc và hãng sản xuất" defaultOpen={false}>
          <div className="pe-card-grid">
            {EQUIPMENT.map((e, i) => (
              <div key={i} className="pe-card-edit">
                <div className="head">
                  <span className="pill">EQ 0{i + 1}</span>
                  <div className="name">{e.name}</div>
                  <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                </div>
                <AdField label="Tên thiết bị"><input className="ad-input" defaultValue={e.name} /></AdField>
                <AdField label="Hãng / xuất xứ"><input className="ad-input" defaultValue={e.vendor} /></AdField>
                <AdField label="Công dụng"><input className="ad-input" defaultValue={e.purpose} /></AdField>
              </div>
            ))}
          </div>
        </PeSection>

        {/* 05 — Certifications */}
        <PeSection num="05" icon="shield" title="Tiêu chuẩn & chứng nhận tham chiếu"
                   sub="Hiển thị các chuẩn QC đang áp dụng" defaultOpen={false}>
          <div className="pe-stack">
            <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Hệ thống QC theo chuẩn quốc tế" /></AdField>
            <AdField label="Mô tả">
              <textarea className="ad-textarea" defaultValue="Phòng QC vận hành theo ISO 9001:2015. Mỗi lô đều có COA và MSDS, đáp ứng yêu cầu của REACH (EU) và SGS." />
            </AdField>
            <div className="pe-row four">
              {['ISO 9001:2015', 'REACH', 'SGS', 'MSDS'].map((c, i) => (
                <div key={i} style={{ background: '#fff', border: '1px solid var(--ad-line)',
                                      borderRadius: 8, padding: 10, display: 'flex',
                                      alignItems: 'center', gap: 8 }}>
                  <input type="checkbox" defaultChecked />
                  <input className="ad-input" defaultValue={c} style={{ height: 28, fontSize: 13 }} />
                </div>
              ))}
            </div>
          </div>
        </PeSection>

        {/* 06 — CTA */}
        <PeSection num="06" icon="mail" title="CTA cuối trang"
                   sub="Yêu cầu COA mẫu" defaultOpen={false}>
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Cần xem COA và MSDS mẫu?" /></AdField>
              <AdField label="Email nhận"><input className="ad-input" defaultValue="qc@long-anh.com" /></AdField>
            </div>
            <AdField label="Mô tả">
              <textarea className="ad-textarea" defaultValue="Chúng tôi gửi mẫu COA, MSDS và bộ tiêu chuẩn đầy đủ cho khách hàng tiềm năng trong vòng 24h." />
            </AdField>
          </div>
        </PeSection>

        {/* 07 — SEO */}
        <PeSeoSection
          num="07"
          metaTitle="Quy trình QC Long Anh — Kiểm soát chất lượng từ mỏ tới container"
          metaDesc="Phòng QC Long Anh kiểm tra độ trắng, CaCO₃, cỡ hạt và độ ẩm trên từng lô sản phẩm. ISO 9001:2015, REACH, SGS."
          keywords={['quy trình QC', 'kiểm soát chất lượng bột đá', 'COA CaCO3', 'ISO 9001 long anh']}
          ogImage="../assets/kiem-dinh.jpg"
          googleSlug="quy trình QC" />

      </PeEditorShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PageEditQc />);
</script>
</body>
</html>
