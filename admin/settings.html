<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cài đặt site · Long Anh Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel">
  const style = document.createElement('style');
  style.textContent = ADMIN_GLOBAL_CSS + `
    .st-tabs { display:flex; border-bottom:1px solid var(--ad-line); margin-bottom:0;
          background:#fff; border-radius:10px 10px 0 0; border:1px solid var(--ad-line);
          border-bottom:1px solid var(--ad-line); }
    .st-tab { padding:14px 20px; font-size:13.5px; font-weight:500; cursor:pointer;
          color:var(--ad-text-soft); border-bottom:2px solid transparent; margin-bottom:-1px;
          display:flex; align-items:center; gap:8px; }
    .st-tab.on { color:var(--ad-primary); border-color:var(--ad-primary); font-weight:600; }
    .st-body { background:#fff; border:1px solid var(--ad-line); border-top:0;
          border-radius:0 0 10px 10px; padding:24px 28px; }
    .st-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .st-logo-row { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
    .st-logo { background:#FAFAFB; border:1.5px dashed var(--ad-line); border-radius:8px;
          aspect-ratio:1.4; display:flex; align-items:center; justify-content:center;
          padding:12px; cursor:pointer; }
    .st-logo img { max-width:100%; max-height:100%; object-fit:contain; }
    .st-social { display:flex; align-items:center; gap:12px; padding:12px 14px;
          background:#fff; border:1px solid var(--ad-line); border-radius:6px; }
    .st-social .ico { width:36px; height:36px; border-radius:8px; display:flex;
          align-items:center; justify-content:center; flex:none; color:#fff; font-weight:600;
          font-size:13px; }
  `;
  document.head.appendChild(style);

  function Settings() {
    const [tab, setTab] = React.useState('general');
    const tabs = [
      ['general', 'Chung', 'settings'],
      ['contact', 'Liên hệ', 'mail'],
      ['social', 'Mạng xã hội', 'globe'],
      ['seo', 'SEO mặc định', 'seo'],
      ['advanced', 'Nâng cao', 'shield'],
    ];

    return (
      <AdPage active="settings"
        crumb={[{ label: 'Trang chủ', href: 'dashboard.html' }, { label: 'Cài đặt site' }]}
        title="Cài đặt site"
        sub="Cấu hình toàn cục cho website Long Anh"
        actions={<button className="ad-btn primary"><AdIcon name="check" size={13} /> Lưu thay đổi</button>}>

        <div className="st-tabs">
          {tabs.map(([k, l, ic]) => (
            <div key={k} className={`st-tab ${tab === k ? 'on' : ''}`} onClick={() => setTab(k)}>
              <AdIcon name={ic} size={15} /> {l}
            </div>
          ))}
        </div>

        <div className="st-body">
          {tab === 'general' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ad-text-mute)',
                              letterSpacing: '.05em', textTransform: 'uppercase', marginBottom: 12 }}>
                  Thương hiệu
                </div>
                <div className="st-logo-row">
                  <div>
                    <div className="st-logo"><img src="../assets/long-anh-logo.png" /></div>
                    <div style={{ fontSize: 12, marginTop: 6 }}>Logo chính (light bg)</div>
                  </div>
                  <div>
                    <div className="st-logo" style={{ background: '#0F3D7A' }}>
                      <img src="../assets/long-anh-logo.png" style={{ filter: 'brightness(0) invert(1)' }} />
                    </div>
                    <div style={{ fontSize: 12, marginTop: 6 }}>Logo dark mode</div>
                  </div>
                  <div>
                    <div className="st-logo" style={{ aspectRatio: 1 }}>
                      <img src="../assets/long-anh-logo.png" />
                    </div>
                    <div style={{ fontSize: 12, marginTop: 6 }}>Favicon</div>
                  </div>
                </div>
              </div>
              <div className="st-grid">
                <AdField label="Tên công ty" req>
                  <input className="ad-input" defaultValue="Công ty TNHH KS Long Anh" />
                </AdField>
                <AdField label="Tên ngắn (hiển thị nav)">
                  <input className="ad-input" defaultValue="Long Anh" />
                </AdField>
                <AdField label="Tagline">
                  <input className="ad-input" defaultValue="Khoáng đá nguyên sinh — Chất lượng từ gốc" />
                </AdField>
                <AdField label="Năm thành lập">
                  <input className="ad-input" defaultValue="2010" />
                </AdField>
              </div>
              <AdField label="Mô tả công ty (1-2 câu)">
                <textarea className="ad-textarea"
                          defaultValue="Long Anh là nhà sản xuất bột đá CaCO₃ siêu mịn, đá slab và đá xẻ hàng đầu Việt Nam, phục vụ 30+ quốc gia." />
              </AdField>
            </div>
          )}

          {tab === 'contact' && (
            <div className="st-grid">
              <AdField label="Hotline" req>
                <input className="ad-input" defaultValue="1900 1234" />
              </AdField>
              <AdField label="Email chính" req>
                <input className="ad-input" defaultValue="info@long-anh.com" />
              </AdField>
              <AdField label="Email kinh doanh">
                <input className="ad-input" defaultValue="sales@long-anh.com" />
              </AdField>
              <AdField label="Email kỹ thuật">
                <input className="ad-input" defaultValue="tech@long-anh.com" />
              </AdField>
              <AdField label="Địa chỉ trụ sở" req>
                <textarea className="ad-textarea"
                          defaultValue="Lô A1-2, KCN Đông Hồi, Quỳ Hợp, Nghệ An" />
              </AdField>
              <AdField label="Địa chỉ văn phòng HN">
                <textarea className="ad-textarea"
                          defaultValue="Tầng 12, Tòa nhà Capital Tower, 109 Trần Hưng Đạo, Hoàn Kiếm, Hà Nội" />
              </AdField>
              <AdField label="Giờ làm việc">
                <input className="ad-input" defaultValue="T2 – T7 · 8:00 – 17:30" />
              </AdField>
              <AdField label="Bản đồ (Google Maps embed URL)">
                <input className="ad-input" defaultValue="https://maps.google.com/embed?..." />
              </AdField>
            </div>
          )}

          {tab === 'social' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {[
                ['Facebook', '#1877F2', 'F', 'https://facebook.com/longanhgroup'],
                ['Zalo', '#0068FF', 'Z', 'https://zalo.me/longanh'],
                ['YouTube', '#FF0000', '▶', 'https://youtube.com/@longanh'],
                ['LinkedIn', '#0A66C2', 'in', 'https://linkedin.com/company/longanh'],
                ['TikTok', '#000000', 'T', ''],
                ['Instagram', '#E4405F', '◉', ''],
              ].map(([name, color, letter, url]) => (
                <div key={name} className="st-social">
                  <div className="ico" style={{ background: color }}>{letter}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 600, fontSize: 13.5 }}>{name}</div>
                    <input className="ad-input" defaultValue={url} placeholder="https://..."
                           style={{ height: 30, marginTop: 4 }} />
                  </div>
                  <AdSwitch on={!!url} onChange={() => {}} />
                </div>
              ))}
            </div>
          )}

          {tab === 'seo' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <AdField label="Site title pattern" help="Dùng %s là tiêu đề trang">
                <input className="ad-input" defaultValue="%s | Long Anh — Bột đá CaCO₃" />
              </AdField>
              <AdField label="Meta description mặc định">
                <textarea className="ad-textarea"
                          defaultValue="Nhà sản xuất bột đá CaCO₃ siêu mịn, đá slab và đá xẻ hàng đầu Việt Nam." />
              </AdField>
              <AdField label="Robots.txt">
                <textarea className="ad-textarea"
                          style={{ fontFamily: 'JetBrains Mono,monospace', minHeight: 110 }}
                          defaultValue={`User-agent: *
Allow: /
Sitemap: https://long-anh.com/sitemap.xml`} />
              </AdField>
              <AdField label="Google verification code">
                <input className="ad-input" defaultValue="google-site-verification=AbCd1234..." />
              </AdField>
            </div>
          )}

          {tab === 'advanced' && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <AdField label="Google Analytics ID">
                <input className="ad-input" defaultValue="G-XXXXXXXXXX" />
              </AdField>
              <AdField label="Facebook Pixel ID">
                <input className="ad-input" defaultValue="" placeholder="123456789012345" />
              </AdField>
              <AdField label="Custom <head> code"
                       help="Code này sẽ được chèn vào trước thẻ </head>">
                <textarea className="ad-textarea"
                          style={{ fontFamily: 'JetBrains Mono,monospace', minHeight: 100 }}
                          placeholder="<!-- Custom head code -->" />
              </AdField>
              <AdField label="Custom <footer> code">
                <textarea className="ad-textarea"
                          style={{ fontFamily: 'JetBrains Mono,monospace', minHeight: 100 }}
                          placeholder="<!-- Tag manager, chat widget, etc. -->" />
              </AdField>
            </div>
          )}
        </div>
      </AdPage>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Settings />);
</script>
</body>
</html>
