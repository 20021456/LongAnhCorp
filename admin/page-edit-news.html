<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sửa: Tin tức · Long Anh Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel" src="page-edit-shell.jsx"></script>
<script type="text/babel">
  const style = document.createElement('style');
  style.textContent = ADMIN_GLOBAL_CSS + PAGE_EDIT_CSS;
  document.head.appendChild(style);

  function PageEditNews() {
    const [lang, setLang] = React.useState('vi');
    const [status, setStatus] = React.useState('pub');

    return (
      <PeEditorShell
        active="pages"
        crumb={[
          { label: 'Trang chủ', href: 'index.html' },
          { label: 'Trang', href: 'pages.html' },
          { label: 'Tin tức' },
        ]}
        title="Tin tức"
        slug="/tin-tuc"
        status={status} setStatus={setStatus}
        previewHref="#"
        lang={lang} setLang={setLang}>

        {/* 01 — Page header */}
        <PeSection num="01" icon="layers" title="Page header — Banner trang"
                   sub="Eyebrow, tiêu đề và mô tả của trang Tin tức">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="// Newsroom · Long Anh" /></AdField>
              <AdField label="Tiêu đề chính" req>
                <input className="ad-input" defaultValue="Tin tức & Cập nhật ngành" />
              </AdField>
            </div>
            <AdField label="Mô tả ngắn">
              <textarea className="ad-textarea" defaultValue="Theo dõi hoạt động của Long Anh, các dự án mới, cập nhật ngành khoáng sản và phân tích thị trường xuất khẩu." />
            </AdField>
          </div>
        </PeSection>

        {/* 02 — Featured posts */}
        <PeSection num="02" icon="star" title="Bài viết nổi bật (Featured)"
                   sub="3 bài hiển thị to ở đầu trang">
          <div className="pe-stack">
            <AdField label="Cách chọn">
              <select className="ad-select">
                <option>Tự động — bài có cờ "Nổi bật"</option>
                <option>Thủ công — chọn từng bài</option>
                <option>Theo lượt xem cao nhất 30 ngày</option>
              </select>
            </AdField>
            <div style={{ background: '#fff', border: '1px solid var(--ad-line)',
                          borderRadius: 8, padding: 12 }}>
              <div style={{ fontSize: 12, color: 'var(--ad-text-mute)', marginBottom: 8 }}>
                Bài đang ghim (3)
              </div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                {[
                  'Long Anh đạt chứng nhận REACH cho thị trường EU',
                  'Khánh thành nhà máy bột siêu mịn số 5',
                  'Báo cáo xuất khẩu Q1/2026 — tăng 28%',
                ].map(p => (
                  <span key={p} className="ad-tag">
                    {p}<button><AdIcon name="x" size={11} /></button>
                  </span>
                ))}
                <button className="ad-btn ghost sm"><AdIcon name="plus" size={12} /> Thêm</button>
              </div>
            </div>
          </div>
        </PeSection>

        {/* 03 — List config */}
        <PeSection num="03" icon="list" title="Danh sách bài viết"
                   sub="Thiết lập hiển thị danh sách bên dưới phần nổi bật">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Số bài/trang"><input className="ad-input" defaultValue="9" /></AdField>
              <AdField label="Sắp xếp">
                <select className="ad-select">
                  <option>Mới nhất trước</option>
                  <option>Cũ nhất trước</option>
                  <option>Lượt xem cao nhất</option>
                </select>
              </AdField>
            </div>
            <AdField label="Layout">
              <div style={{ display: 'flex', gap: 8 }}>
                {['Grid 3 cột', 'Grid 2 cột', 'List dọc'].map((l, i) => (
                  <label key={l} style={{ display: 'flex', alignItems: 'center', gap: 6,
                                          padding: '8px 12px', border: '1px solid var(--ad-line)',
                                          borderRadius: 6, fontSize: 13, cursor: 'pointer',
                                          background: i === 0 ? 'var(--ad-primary-soft)' : '#fff',
                                          color: i === 0 ? 'var(--ad-primary)' : 'inherit' }}>
                    <input type="radio" name="news-layout" defaultChecked={i === 0} /> {l}
                  </label>
                ))}
              </div>
            </AdField>
            <AdField label="Hiển thị tóm tắt">
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <AdSwitch on={true} onChange={() => {}} />
                <span style={{ fontSize: 12.5, color: 'var(--ad-text-mute)' }}>Hiện đoạn mở đầu (~140 ký tự) bên dưới mỗi bài</span>
              </div>
            </AdField>
          </div>
        </PeSection>

        {/* 04 — Categories & tags */}
        <PeSection num="04" icon="folder" title="Danh mục & tag"
                   sub="Bộ lọc hiển thị trên trang">
          <div className="pe-stack">
            <AdField label="Danh mục hiển thị (theo thứ tự)">
              <PeTags tags={['Tin công ty', 'Sản phẩm mới', 'Thị trường', 'Phát triển bền vững', 'Sự kiện']} />
            </AdField>
            <AdField label="Tag gợi ý">
              <PeTags tags={['CaCO3', 'xuất khẩu', 'Quỳ Hợp', 'ISO 9001', 'REACH']} />
            </AdField>
            <AdField label="Hiển thị thanh tìm kiếm">
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <AdSwitch on={true} onChange={() => {}} />
                <span style={{ fontSize: 12.5, color: 'var(--ad-text-mute)' }}>Cho phép tìm theo tiêu đề và nội dung</span>
              </div>
            </AdField>
          </div>
        </PeSection>

        {/* 05 — Newsletter CTA */}
        <PeSection num="05" icon="mail" title="CTA đăng ký nhận tin"
                   sub="Khối email signup ở cuối danh sách" defaultOpen={false}>
          <div className="pe-stack">
            <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Đừng bỏ lỡ tin tức ngành" /></AdField>
            <AdField label="Mô tả">
              <textarea className="ad-textarea" defaultValue="Nhận bản tin hàng tháng về sản phẩm mới, phân tích thị trường và cập nhật từ Long Anh." />
            </AdField>
            <AdField label="Placeholder ô email"><input className="ad-input" defaultValue="email@cong-ty-cua-ban.com" /></AdField>
            <AdField label="Chữ trên nút"><input className="ad-input" defaultValue="Đăng ký nhận tin" /></AdField>
            <AdField label="Mailing list (Mailchimp/Brevo)">
              <input className="ad-input" defaultValue="long-anh-newsletter" />
            </AdField>
          </div>
        </PeSection>

        {/* 06 — SEO */}
        <PeSeoSection
          num="06"
          metaTitle="Tin tức Long Anh — Cập nhật ngành khoáng sản & xuất khẩu"
          metaDesc="Theo dõi hoạt động Long Anh, sản phẩm mới, dự án xuất khẩu và phân tích thị trường bột đá CaCO₃ Việt Nam."
          keywords={['tin tức Long Anh', 'ngành khoáng sản', 'xuất khẩu đá vôi', 'CaCO3 việt nam']}
          ogImage="../assets/nha-may-bot-sieu-min.webp"
          googleSlug="tin tức" />

      </PeEditorShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PageEditNews />);
</script>
</body>
</html>
