<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sửa: Tuyển dụng · Long Anh Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel" src="page-edit-shell.jsx"></script>
<script type="text/babel">
  const style = document.createElement('style');
  style.textContent = ADMIN_GLOBAL_CSS + PAGE_EDIT_CSS;
  document.head.appendChild(style);

  function PageEditCareers() {
    const [lang, setLang] = React.useState('vi');
    const [status, setStatus] = React.useState('hide');

    const STATS = [
      { val: '20+', label: 'Năm kinh nghiệm' },
      { val: '150+', label: 'Cán bộ nhân viên' },
      { val: '5', label: 'Nhà máy & chi nhánh' },
      { val: '12', label: 'Thị trường xuất khẩu' },
    ];

    const JOBS = [
      { title: 'Kỹ sư vận hành dây chuyền nghiền', dept: 'Sản xuất', loc: 'Quỳ Hợp, Nghệ An', type: 'Toàn thời gian', open: true },
      { title: 'Trưởng phòng kinh doanh xuất khẩu', dept: 'Kinh doanh', loc: 'Hà Nội', type: 'Toàn thời gian', open: true },
      { title: 'Chuyên viên QC — phòng thí nghiệm', dept: 'Chất lượng', loc: 'Quỳ Hợp, Nghệ An', type: 'Toàn thời gian', open: true },
      { title: 'Nhân viên kế toán nội bộ', dept: 'Hành chính', loc: 'Hà Nội', type: 'Toàn thời gian', open: false },
      { title: 'Kỹ thuật viên bảo trì cơ điện', dept: 'Kỹ thuật', loc: 'Quỳ Hợp, Nghệ An', type: 'Toàn thời gian', open: true },
    ];

    const VALUES = [
      ['Chính trực & Minh bạch', 'Mọi quyết định đều dựa trên dữ liệu và sự thật. Đối thoại cởi mở và nhận trách nhiệm về kết quả.'],
      ['Tinh thần đồng đội', 'Thành công là kết quả của tập thể. Đặt lợi ích chung lên trên và hỗ trợ nhau phát triển.'],
      ['Đổi mới liên tục', 'Liên tục cải tiến quy trình, nâng cấp công nghệ và tìm kiếm các giải pháp sáng tạo.'],
      ['Chất lượng là cốt lõi', 'Tiêu chuẩn ISO 9001 không phải đích đến — mà là nền tảng tối thiểu.'],
      ['Phát triển bền vững', 'Khai thác và sản xuất có trách nhiệm với môi trường và cộng đồng địa phương.'],
      ['Hướng ra quốc tế', 'Với 12 thị trường xuất khẩu, nhân viên Long Anh tiếp xúc với tư duy toàn cầu ngay tại Nghệ An.'],
    ];

    const BENEFITS = [
      ['Lương & Thưởng cạnh tranh', 'Mức lương theo năng lực, xét tăng lương 2 lần/năm. Thưởng hiệu suất hàng quý.'],
      ['Bảo hiểm toàn diện', 'BHXH, BHYT, BHTN theo quy định. Bảo hiểm sức khỏe bổ sung cho nhân viên và gia đình.'],
      ['Đào tạo & Phát triển', 'Đào tạo nội bộ định kỳ, hỗ trợ học phí, cử nhân viên tham gia hội thảo quốc tế.'],
      ['Môi trường hiện đại', 'Văn phòng và nhà máy được trang bị đầy đủ thiết bị bảo hộ tiêu chuẩn.'],
      ['Nghỉ phép & Lễ tết', '12 ngày phép có lương/năm. Nghỉ lễ theo nhà nước cộng các ngày đặc biệt của công ty.'],
      ['Hoạt động tập thể', 'Team building hàng năm, du lịch công ty, các giải thể thao nội bộ.'],
    ];

    const STEPS = [
      ['Nộp hồ sơ', 'Gửi CV qua form online hoặc email hr@longanhcorp.com. Phản hồi trong 3 ngày làm việc.'],
      ['Phỏng vấn sơ bộ', 'Trao đổi qua điện thoại hoặc video call để hiểu về kinh nghiệm và mong muốn.'],
      ['Phỏng vấn chuyên sâu', 'Gặp trực tiếp với quản lý bộ phận. Có thể bao gồm bài kiểm tra kỹ năng tùy vị trí.'],
      ['Nhận offer & Onboarding', 'Thư đề nghị làm việc trong 5 ngày sau phỏng vấn cuối. Hội nhập 30 ngày đầu.'],
    ];

    return (
      <PeEditorShell
        active="pages"
        crumb={[
          { label: 'Trang chủ', href: 'index.html' },
          { label: 'Trang', href: 'pages.html' },
          { label: 'Tuyển dụng' },
        ]}
        title="Tuyển dụng"
        slug="/tuyen-dung"
        status={status} setStatus={setStatus}
        previewHref="../career.html"
        lang={lang} setLang={setLang}>

        {/* 01 — Hero */}
        <PeSection num="01" icon="layers" title="Hero — Banner trang"
                   sub="Eyebrow, tiêu đề lớn, mô tả và 4 stats nổi bật">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Cơ hội nghề nghiệp" /></AdField>
              <AdField label="CTA - chữ"><input className="ad-input" defaultValue="Xem vị trí tuyển dụng" /></AdField>
            </div>
            <AdField label="Tiêu đề chính" req>
              <input className="ad-input" defaultValue="Gia nhập đội ngũ Long Anh — nơi tài năng được phát triển." />
            </AdField>
            <AdField label="Mô tả">
              <textarea className="ad-textarea" defaultValue="Chúng tôi xây dựng một môi trường làm việc chuyên nghiệp, năng động và minh bạch, nơi mỗi cá nhân đều có cơ hội đóng góp và trưởng thành." />
            </AdField>
            <div style={{ borderTop: '1px solid var(--ad-line-soft)', paddingTop: 14 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ad-text-mute)',
                            letterSpacing: '.05em', textTransform: 'uppercase', marginBottom: 10 }}>
                4 stats hero
              </div>
              <div className="pe-row four">
                {STATS.map((s, i) => (
                  <div key={i} style={{ background: '#fff', border: '1px solid var(--ad-line)',
                                        borderRadius: 8, padding: 12, display: 'flex',
                                        flexDirection: 'column', gap: 8 }}>
                    <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--ad-text-mute)' }}>
                      STAT {i + 1}
                    </span>
                    <input className="ad-input" defaultValue={s.val} style={{ fontWeight: 700, fontSize: 18 }} />
                    <input className="ad-input" defaultValue={s.label} style={{ fontSize: 12 }} />
                  </div>
                ))}
              </div>
            </div>
          </div>
        </PeSection>

        {/* 02 — Job listings */}
        <PeSection num="02" icon="users" title="Vị trí đang tuyển"
                   sub="Danh sách công việc · có thể lọc theo phòng ban">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Tiêu đề section"><input className="ad-input" defaultValue="Cơ hội việc làm hiện tại" /></AdField>
              <AdField label="Email nhận hồ sơ"><input className="ad-input" defaultValue="hr@longanhcorp.com" /></AdField>
            </div>
            <AdField label="Mô tả">
              <textarea className="ad-textarea" defaultValue="Tất cả các vị trí đều mở cửa cho ứng viên có năng lực và tinh thần học hỏi — kinh nghiệm ngành khoáng sản là lợi thế." />
            </AdField>
            <AdField label="Phòng ban (filter)">
              <PeTags tags={['Sản xuất', 'Kinh doanh', 'Chất lượng', 'Hành chính', 'Kỹ thuật']} />
            </AdField>
            <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ad-text-mute)',
                          letterSpacing: '.05em', textTransform: 'uppercase' }}>
              Vị trí · {JOBS.filter(j => j.open).length} đang mở
            </div>
            <div className="pe-stack">
              {JOBS.map((j, i) => (
                <div key={i} className="pe-job-card">
                  <div className="head">
                    <span className="pill">JOB {String(i + 1).padStart(2, '0')}</span>
                    <div className="name">{j.title}</div>
                    <span className={j.open ? 'ad-badge pub' : 'ad-badge hide'} style={{ fontSize: 10 }}>
                      <span className="dot" />{j.open ? 'Đang mở' : 'Đã đóng'}
                    </span>
                    <button title="Sửa"><AdIcon name="edit" size={13} /></button>
                    <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr 1fr 1fr', gap: 10 }}>
                    <input className="ad-input" defaultValue={j.title} />
                    <select className="ad-select" defaultValue={j.dept}>
                      {['Sản xuất', 'Kinh doanh', 'Chất lượng', 'Hành chính', 'Kỹ thuật'].map(d =>
                        <option key={d}>{d}</option>
                      )}
                    </select>
                    <input className="ad-input" defaultValue={j.loc} />
                    <select className="ad-select" defaultValue={j.type}>
                      <option>Toàn thời gian</option>
                      <option>Bán thời gian</option>
                      <option>Hợp đồng dự án</option>
                    </select>
                  </div>
                </div>
              ))}
            </div>
            <button className="ad-btn primary" style={{ width: 'fit-content' }}>
              <AdIcon name="plus" size={13} /> Đăng vị trí mới
            </button>
          </div>
        </PeSection>

        {/* 03 — Values */}
        <PeSection num="03" icon="grid" title="Văn hóa doanh nghiệp"
                   sub="6 giá trị cốt lõi (Values grid)">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Văn hóa doanh nghiệp" /></AdField>
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Điều làm nên Long Anh" /></AdField>
            </div>
            <AdField label="Mô tả">
              <textarea className="ad-textarea" defaultValue="Chúng tôi không chỉ sản xuất khoáng sản — chúng tôi xây dựng con người và tổ chức có giá trị lâu bền." />
            </AdField>
            <div className="pe-card-grid">
              {VALUES.map((v, i) => (
                <div key={i} className="pe-card-edit">
                  <div className="head">
                    <span className="pill">VAL 0{i + 1}</span>
                    <div className="name">{v[0]}</div>
                    <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                  </div>
                  <AdField label="Tiêu đề"><input className="ad-input" defaultValue={v[0]} /></AdField>
                  <AdField label="Mô tả"><textarea className="ad-textarea" defaultValue={v[1]} style={{ minHeight: 60 }} /></AdField>
                </div>
              ))}
            </div>
          </div>
        </PeSection>

        {/* 04 — Benefits */}
        <PeSection num="04" icon="star" title="Phúc lợi"
                   sub="6 ô phúc lợi cho nhân viên">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Phúc lợi" /></AdField>
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Chúng tôi chăm lo cho bạn" /></AdField>
            </div>
            <div className="pe-list">
              {BENEFITS.map((b, i) => (
                <div key={i} className="pe-list-item">
                  <span className="num">0{i + 1}</span>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 10 }}>
                    <input className="ad-input" defaultValue={b[0]} />
                    <input className="ad-input" defaultValue={b[1]} />
                  </div>
                  <div className="actions">
                    <button title="Kéo"><AdIcon name="drag" size={13} /></button>
                    <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                  </div>
                </div>
              ))}
            </div>
            <button className="ad-btn" style={{ width: 'fit-content' }}>
              <AdIcon name="plus" size={13} /> Thêm phúc lợi
            </button>
          </div>
        </PeSection>

        {/* 05 — Hiring process */}
        <PeSection num="05" icon="trend" title="Quy trình tuyển dụng"
                   sub="4 bước cho ứng viên" defaultOpen={false}>
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Quy trình tuyển dụng" /></AdField>
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Đơn giản. Minh bạch. Nhanh chóng." /></AdField>
            </div>
            <div className="pe-list">
              {STEPS.map((s, i) => (
                <div key={i} className="pe-list-item">
                  <span className="num">0{i + 1}</span>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 10 }}>
                    <input className="ad-input" defaultValue={s[0]} />
                    <input className="ad-input" defaultValue={s[1]} />
                  </div>
                  <div className="actions">
                    <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </PeSection>

        {/* 06 — CV upload CTA */}
        <PeSection num="06" icon="upload" title="CTA — Gửi CV tự do"
                   sub="Block kêu gọi ứng tuyển kể cả khi chưa có vị trí phù hợp" defaultOpen={false}>
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Gửi hồ sơ ứng tuyển tự do" /></AdField>
              <AdField label="Email nhận"><input className="ad-input" defaultValue="hr@longanhcorp.com" /></AdField>
            </div>
            <AdField label="Mô tả">
              <textarea className="ad-textarea" defaultValue="Chưa thấy vị trí phù hợp? Chúng tôi vẫn luôn sẵn sàng đón nhận tài năng mới — gửi CV và Long Anh sẽ liên hệ khi có cơ hội phù hợp." />
            </AdField>
          </div>
        </PeSection>

        {/* 07 — SEO */}
        <PeSeoSection
          num="07"
          metaTitle="Tuyển dụng Long Anh — Cơ hội nghề nghiệp tại Nghệ An & Hà Nội"
          metaDesc="Long Anh tuyển dụng kỹ sư sản xuất, kinh doanh xuất khẩu, QC và kỹ thuật. Lương cạnh tranh, BHYT toàn diện, đào tạo quốc tế."
          keywords={['tuyển dụng Long Anh', 'việc làm Nghệ An', 'kỹ sư sản xuất', 'QC bột đá', 'kinh doanh xuất khẩu']}
          ogImage="../assets/nha-may-bot-sieu-min.webp"
          googleSlug="tuyển dụng" />

      </PeEditorShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PageEditCareers />);
</script>
</body>
</html>
