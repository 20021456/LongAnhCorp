  function slugify(s) {
    return s.toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd')
      .replace(/[^a-z0-9 -]/g, '').trim().replace(/\s+/g, '-');
  }

  function NewsEdit() {
    const params  = new URLSearchParams(location.search);
    const idParam = parseInt(params.get('id') || '0', 10);
    const isNew   = !idParam || !POSTS[idParam];
    const id      = isNew ? 0 : idParam;
    const post    = isNew
      ? { cat: 'business', date: new Date().toISOString().slice(0, 10),
          views: 0, comments: 0, author: 'AN', readMin: 3,
          img: '', title: '', excerpt: '', body: '', tags: [] }
      : POSTS[id];

    const [lang,    setLang]    = React.useState('vi');
    const [status,  setStatus]  = React.useState('pub');
    const [title,   setTitle]   = React.useState(post.title);
    const [slug,    setSlug]    = React.useState('bai-' + (id || 'moi'));
    const [excerpt, setExcerpt] = React.useState(post.excerpt);
    const [body,    setBody]    = React.useState(post.body);
    const [cat,     setCat]     = React.useState(post.cat);
    const [featured,setFeatured]= React.useState(post.views > 2000);
    const [author,  setAuthor]  = React.useState(post.author);
    const [pubDate, setPubDate] = React.useState(post.date);
    const [tags,    setTags]    = React.useState(post.tags);

    /* Image gallery for the post: cover + any extra images attached. */
    const [gallery, setGallery] = React.useState(() => {
      const seed = [];
      if (post.img) seed.push({ src: post.img, alt: post.title, featured: true });
      /* Demo: pre-fill a couple of related images so the section isn't empty. */
      if (!isNew) {
        const extras = [
          '../assets/da-nguyen-lieu-cao-cap.webp',
          '../assets/co-so-ha-tang.jpg',
          '../assets/kho-hang-2.webp',
        ];
        extras.forEach(s => { if (s !== post.img) seed.push({ src: s, alt: '', featured: false }); });
      }
      return seed;
    });
    const [editAltIdx, setEditAltIdx] = React.useState(-1);
    const [altDraft, setAltDraft]     = React.useState('');

    function regenSlug() { setSlug(title ? slugify(title) : 'bai-moi'); }

    function gAddDemo() {
      /* Mock "upload" — picks a random asset so user sees a new tile appear. */
      const pool = [
        '../assets/bot-caco3-sieu-min.webp',
        '../assets/bot-sieu-min.webp',
        '../assets/da-slab-sieu-trang.webp',
        '../assets/kho-da-nguyen-lieu.webp',
        '../assets/nha-may-bot-sieu-min.webp',
        '../assets/nha-may-bot-sieu-min-1.webp',
        '../assets/kiem-dinh.jpg',
        '../assets/kho-hang.webp',
      ];
      const next = pool[Math.floor(Math.random() * pool.length)];
      setGallery(g => [...g, { src: next, alt: '', featured: false }]);
    }
    function gMakeFeatured(i) {
      setGallery(g => g.map((it, j) => ({ ...it, featured: j === i })));
    }
    function gMoveUp(i) {
      if (i === 0) return;
      setGallery(g => { const c = [...g]; [c[i - 1], c[i]] = [c[i], c[i - 1]]; return c; });
    }
    function gMoveDown(i) {
      setGallery(g => {
        if (i >= g.length - 1) return g;
        const c = [...g]; [c[i], c[i + 1]] = [c[i + 1], c[i]]; return c;
      });
    }
    function gDelete(i) { setGallery(g => g.filter((_, j) => j !== i)); }
    function gInsertIntoBody(src) {
      setBody(b => `${b}${b && !b.endsWith('\n') ? '\n\n' : ''}![](${src})\n\n`);
    }
    function gOpenAlt(i) { setEditAltIdx(i); setAltDraft(gallery[i].alt || ''); }
    function gSaveAlt() {
      setGallery(g => g.map((it, j) => j === editAltIdx ? { ...it, alt: altDraft } : it));
      setEditAltIdx(-1);
    }

                    color: cat === k ? 'var(--ad-primary)' : 'var(--ad-text-soft)',
                  }}>
                    <input type="radio" name="cat" checked={cat === k}
                           onChange={() => setCat(k)} /> {l}
                  </label>
                ))}
              </div>
            </div>

            <div className="ad-card">
              <div className="ad-card-head"><h3>Cờ & hiển thị</h3></div>
              <div style={{ padding: 14, display: 'flex', flexDirection: 'column', gap: 12, fontSize: 13 }}>
                <label style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <span>Bài viết nổi bật (Featured)</span>
                  <AdSwitch on={featured} onChange={setFeatured} />
                </label>
                <label style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <span>Ghim lên đầu danh mục</span>
                  <AdSwitch on={false} onChange={() => {}} />
                </label>
                <label style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                  <span>Cho phép bình luận</span>
                  <AdSwitch on={true} onChange={() => {}} />
                </label>
              </div>
            </div>

            <div className="ad-card">
              <div className="ad-card-head"><h3>Tác giả & ngày đăng</h3></div>
              <div style={{ padding: 14, display: 'flex', flexDirection: 'column', gap: 12 }}>
                <AdField label="Tác giả">
                  <select className="ad-select" value={author} onChange={e => setAuthor(e.target.value)}>
                    {Object.entries(AUTHORS).map(([k, v]) =>
                      <option key={k} value={k}>{v.name} · {v.role}</option>
                    )}
                  </select>
                </AdField>
                <AdField label="Ngày xuất bản">
                  <input className="ad-input" type="date"
                         value={pubDate} onChange={e => setPubDate(e.target.value)} />
                </AdField>
                {!isNew && (
                  <div style={{ background: 'var(--ad-line-soft)', borderRadius: 6,
                                padding: 10, fontSize: 11.5, color: 'var(--ad-text-soft)' }}>
                    {post.views.toLocaleString()} lượt xem · {post.comments} bình luận · {post.readMin} phút đọc
                  </div>
                )}
              </div>
            </div>
          </>
        }>

        {/* 01 — Cover + Title + Slug */}
        <PeSection num="01" icon="image" title="Ảnh bìa & Tiêu đề"
                   sub="Cover (1600×700), tiêu đề và đường dẫn">
          <div className="pe-stack">
            <div className="ne-cover">
              {post.img
                ? <img src={post.img} alt={title} />
                : <div style={{
                    position: 'absolute', inset: 0, display: 'flex',
                    flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
                    color: 'var(--ad-text-mute)', gap: 8 }}>
                    <AdIcon name="upload" size={26} />
                    <div style={{ fontSize: 13 }}>Tải ảnh bìa (khuyến nghị 1600×700)</div>
                  </div>}
              <div className="ne-cover-over">
                <button className="ad-btn"><AdIcon name="refresh" size={13} /> Đổi ảnh</button>
                <button className="ad-btn"><AdIcon name="edit" size={13} /> Crop</button>
              </div>
            </div>

            <AdField label="Tiêu đề bài viết" req
                     help={`${title.length}/100 ký tự · Khuyến nghị 60-80 ký tự cho SEO`}>
              <input className="ne-title-input"
                     value={title} onChange={e => setTitle(e.target.value)}
                     placeholder="Nhập tiêu đề bài viết…" />
            </AdField>

            <div className="ne-slug">
              <AdIcon name="link" size={13} />
              long-anh.com/tin-tuc/<code>{slug}</code>
              <button className="ad-btn ghost sm" onClick={regenSlug}
                      style={{ marginLeft: 'auto' }} title="Tạo lại từ tiêu đề">
                <AdIcon name="refresh" size={12} /> Tạo lại slug
              </button>
            </div>
          </div>
        </PeSection>

        {/* 02 — Excerpt */}
        <PeSection num="02" icon="file" title="Tóm tắt (Excerpt)"
                   sub="2-3 câu hiển thị trên list, social share và Google preview">
          <AdField label="Đoạn tóm tắt" req
                   help={`${excerpt.length}/200 ký tự · 140-180 là tối ưu`}>
            <textarea className="ad-textarea" style={{ minHeight: 80 }}
                      value={excerpt} onChange={e => setExcerpt(e.target.value)}
                      placeholder="Mô tả ngắn 2-3 câu…" />
          </AdField>
        </PeSection>

        {/* 03 — Body */}
        <PeSection num="03" icon="edit" title="Nội dung bài viết"
                   sub="Soạn thảo nội dung chính (rich text)">
          <div className="pe-stack">
            <div className="ne-body-toolbar">
              <button title="Bold"><b style={{ fontSize: 13 }}>B</b></button>
              <button title="Italic"><i style={{ fontSize: 13 }}>I</i></button>
              <button title="Underline"><u style={{ fontSize: 13 }}>U</u></button>
              <div className="sep" />
              <button title="Heading"><b style={{ fontSize: 11 }}>H₂</b></button>
              <button title="Quote">"</button>
              <button title="Link"><AdIcon name="link" size={13} /></button>
              <div className="sep" />
              <button title="Bullet list"><AdIcon name="list" size={13} /></button>
              <button title="Image"><AdIcon name="image" size={13} /></button>
              <button title="Embed"><AdIcon name="globe" size={13} /></button>
              <div className="sep" />
              <button title="Hoàn tác"><AdIcon name="refresh" size={13} /></button>
            </div>
            <textarea className="ne-body" style={{ resize: 'vertical' }}
                      value={body} onChange={e => setBody(e.target.value)}
                      placeholder="Viết nội dung bài viết…" />
            <div style={{ display: 'flex', gap: 14, fontSize: 12, color: 'var(--ad-text-mute)' }}>
              <span>{body.length.toLocaleString()} ký tự</span>
              <span>~{Math.max(1, Math.round(body.split(/\s+/).length / 200))} phút đọc</span>
              <span>{body.split(/\s+/).filter(Boolean).length} từ</span>
            </div>
          </div>
        </PeSection>

        {/* 04 — Image gallery */}
        <PeSection num="04" icon="image" title="Thư viện ảnh"
                   sub={`Quản lý ảnh đính kèm bài viết · ${gallery.length} ảnh`}>
          <div className="pe-stack">
            <div className="ne-gallery">
              {gallery.map((g, i) => (
                <div key={i} className="ne-gimg">
                  <img src={g.src} alt={g.alt} />
                  <span className="badge">IMG {String(i + 1).padStart(2, '0')}</span>
                  {g.featured && (
                    <span className="featured-flag">
                      <AdIcon name="star" size={10} /> Bìa
                    </span>
                  )}
                  {g.alt && <div className="alt">{g.alt}</div>}
                  <div className="over">
                    <button className="ad-btn sm" title="Đặt làm ảnh bìa"
                            onClick={() => gMakeFeatured(i)}>
                      <AdIcon name="star" size={12} />
                    </button>
                    <button className="ad-btn sm" title="Sửa mô tả (alt)"
                            onClick={() => gOpenAlt(i)}>
                      <AdIcon name="edit" size={12} />
                    </button>
                    <button className="ad-btn sm" title="Chèn vào nội dung"
                            onClick={() => gInsertIntoBody(g.src)}>
                      <AdIcon name="plus" size={12} />
                    </button>
                    <button className="ad-btn sm" title="Đẩy lên"
                            onClick={() => gMoveUp(i)} disabled={i === 0}>
                      <AdIcon name="arrowLeft" size={12} />
                    </button>
                    <button className="ad-btn sm" title="Đẩy xuống"
                            onClick={() => gMoveDown(i)} disabled={i === gallery.length - 1}>
                      <AdIcon name="arrowRight" size={12} />
                    </button>
                    <button className="ad-btn sm danger" title="Xóa"
                            onClick={() => gDelete(i)}>
                      <AdIcon name="trash" size={12} />
                    </button>
                  </div>
                </div>
              ))}
              <button className="ne-gadd" onClick={gAddDemo}>
                <AdIcon name="upload" size={22} />
                <div>Tải ảnh lên</div>
                <div style={{ fontSize: 11, opacity: .7 }}>hoặc kéo thả</div>
              </button>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
              <button className="ad-btn" onClick={gAddDemo}>
                <AdIcon name="upload" size={13} /> Thêm ảnh
              </button>
              <button className="ad-btn">
                <AdIcon name="image" size={13} /> Chọn từ thư viện chung
              </button>
              <div style={{ fontSize: 12, color: 'var(--ad-text-mute)', marginLeft: 'auto' }}>
                Khuyến nghị: JPG/WebP · &lt; 1MB · ảnh ngang 1200×800px
              </div>
            </div>
          </div>
        </PeSection>

        {editAltIdx >= 0 && (
          <div className="ne-galt-modal" onClick={() => setEditAltIdx(-1)}>
            <div className="ne-galt-card" onClick={e => e.stopPropagation()}>
              <h3>Mô tả ảnh (alt text)</h3>
              <AdField label="Văn bản thay thế"
                       help="Quan trọng cho SEO và screen reader. Mô tả ngắn gọn nội dung ảnh.">
                <input className="ad-input" autoFocus
                       value={altDraft} onChange={e => setAltDraft(e.target.value)}
                       placeholder="Ví dụ: Bao bột đá CaCO₃ tại kho xuất khẩu" />
              </AdField>
              <div className="actions">
                <button className="ad-btn" onClick={() => setEditAltIdx(-1)}>Hủy</button>
                <button className="ad-btn primary" onClick={gSaveAlt}>
                  <AdIcon name="check" size={13} /> Lưu
                </button>
              </div>
            </div>
          </div>
        )}

        {/* 05 — Tags */}
        <PeSection num="05" icon="folder" title="Tags & Bài liên quan"
                   sub={'Tags hỗ trợ tìm kiếm và section "Bài liên quan"'}
                   defaultOpen={false}>
          <div className="pe-stack">
            <AdField label="Tags">
              <PeTags tags={tags} />
            </AdField>
            <AdField label="Bài liên quan thủ công (tối đa 3)"
                     help="Để trống cho hệ thống tự gợi ý theo danh mục + tag">
              <PeTags tags={[]} />
            </AdField>
          </div>
        </PeSection>

        {/* 06 — Stats overview (read-only when editing existing post) */}
        {!isNew && (
          <PeSection num="06" icon="trend" title="Thống kê bài viết"
                     sub="Hiển thị, không cho phép sửa" defaultOpen={false}>
            <div className="ne-meta-row">
              <div>
                <div className="lbl">Lượt xem</div>
                <div style={{ fontSize: 18, fontWeight: 700 }}>{post.views.toLocaleString()}</div>
              </div>
              <div>
                <div className="lbl">Bình luận</div>
                <div style={{ fontSize: 18, fontWeight: 700 }}>{post.comments}</div>
              </div>
              <div>
                <div className="lbl">Thời gian đọc</div>
                <div style={{ fontSize: 18, fontWeight: 700 }}>{post.readMin} phút</div>
              </div>
            </div>
          </PeSection>
        )}

        {/* 07 — SEO */}
        <PeSeoSection
          num={isNew ? '06' : '07'}
          metaTitle={title || 'Tiêu đề bài viết Long Anh'}
          metaDesc={excerpt}
          keywords={tags}
          ogImage={(gallery.find(g => g.featured) || gallery[0] || {}).src || post.img}
          googleSlug={`tin-tuc/${slug}`} />

      </PeEditorShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<NewsEdit />);
</script>
</body>
</html>
