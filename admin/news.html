<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tin tức · Long Anh Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel">
  const style = document.createElement('style');
  style.textContent = ADMIN_GLOBAL_CSS + `
    .nw-thumb { width:60px; height:42px; border-radius:4px; object-fit:cover;
          flex:none; background:var(--ad-line-soft); }
    .nw-title-cell { display:flex; gap:12px; align-items:center; }
    .nw-cat { display:inline-block; padding:2px 8px; border-radius:99px;
          font-size:11px; font-weight:600; line-height:1.6; }
    .nw-cat.business  { background:#E8F0FB; color:#1D4ED8; }
    .nw-cat.product   { background:#FFF1E5; color:#C2410C; }
    .nw-cat.event     { background:#FCE7F3; color:#BE185D; }
    .nw-cat.csr       { background:#DCFCE7; color:#15803D; }
    .nw-cat.tech      { background:#EDE9FE; color:#6D28D9; }
    .nw-cat.milestone { background:#FEF3C7; color:#A16207; }
  `;
  document.head.appendChild(style);

  // Same 12 posts as /news.html. "status" is admin-only: pub/draft/sched.
  const POSTS = [
    { id: 1,  cat: 'business',  date: '06/05/2026', views: 4280, comments: 23, status: 'pub',
      title: 'Long Anh ký hợp đồng xuất khẩu 12,000 tấn bột đá CaCO₃ sang Ấn Độ',
      img: '../assets/kho-hang-xuat-khau.webp', author: 'AN' },
    { id: 2,  cat: 'milestone', date: '02/05/2026', views: 2156, comments: 8,  status: 'pub',
      title: 'Khánh thành dây chuyền nghiền bột siêu mịn số 4 tại Quỳ Hợp',
      img: '../assets/nha-may-bot-sieu-min-3.webp', author: 'LH' },
    { id: 3,  cat: 'tech',      date: '28/04/2026', views: 1820, comments: 12, status: 'pub',
      title: 'Đạt chứng nhận ISO 9001:2015 cho toàn bộ 5 nhà máy',
      img: '../assets/kiem-dinh.jpg', author: 'AN' },
    { id: 4,  cat: 'product',   date: '25/04/2026', views: 1490, comments: 5,  status: 'pub',
      title: 'Báo giá tháng 5: Đá Slab 1.6×2.4m và bảng giá xuất khẩu CaCO₃',
      img: '../assets/da-slab-sieu-trang.webp', author: 'LH' },
    { id: 5,  cat: 'event',     date: '15/04/2026', views: 982,  comments: 3,  status: 'pub',
      title: 'Long Anh tham gia triển lãm Vietbuild Hà Nội 2026',
      img: '../assets/co-so-ha-tang.jpg', author: 'AN' },
    { id: 6,  cat: 'business',  date: '08/04/2026', views: 1670, comments: 7,  status: 'pub',
      title: 'Mở rộng thị trường Trung Đông: 3 hợp đồng mới tại UAE và Ai Cập',
      img: '../assets/nha-may-bot-sieu-min.webp', author: 'AN' },
    { id: 7,  cat: 'milestone', date: '22/03/2026', views: 3540, comments: 41, status: 'pub',
      title: 'Lễ kỷ niệm 20 năm thành lập KS Long Anh (2006-2026)',
      img: '../assets/kho-hang.webp', author: 'AN' },
    { id: 8,  cat: 'csr',       date: '10/03/2026', views: 740,  comments: 18, status: 'pub',
      title: 'Long Anh tài trợ chương trình học bổng cho học sinh Quỳ Hợp',
      img: '../assets/kho-da-nguyen-lieu.webp', author: 'LH' },
    { id: 9,  cat: 'product',   date: '02/03/2026', views: 1280, comments: 6,  status: 'pub',
      title: 'Ra mắt dòng bột CaCO₃ siêu mịn 3 µm cho compound nhựa PVC cao cấp',
      img: '../assets/bot-caco3-sieu-min.webp', author: 'LH' },
    { id: 10, cat: 'event',     date: '18/02/2026', views: 856,  comments: 4,  status: 'pub',
      title: 'Long Anh đón đoàn khách Nhật Bản tham quan nhà máy Quỳ Hợp',
      img: '../assets/nha-may-bot-sieu-min-1.webp', author: 'AN' },
    { id: 11, cat: 'tech',      date: '05/02/2026', views: 2105, comments: 14, status: 'pub',
      title: 'Đầu tư 80 tỷ đồng nâng cấp dây chuyền phủ Stearic Acid thế hệ mới',
      img: '../assets/co-so-ha-tang.jpg', author: 'AN' },
    { id: 12, cat: 'business',  date: '22/01/2026', views: 1340, comments: 9,  status: 'pub',
      title: 'Tổng kết 2025: Doanh thu xuất khẩu tăng 32%, mở thêm 2 thị trường mới',
      img: '../assets/da-nguyen-lieu-cao-cap2.webp', author: 'LH' },
  ];

  const CAT_LABEL = {
    business: 'Kinh doanh', product: 'Sản phẩm', event: 'Sự kiện',
    csr: 'CSR', tech: 'Công nghệ', milestone: 'Cột mốc',
  };

  function NewsList() {
    const [cat, setCat]       = React.useState('all');
    const [search, setSearch] = React.useState('');

    const filtered = POSTS.filter(p => cat === 'all' || p.cat === cat)
      .filter(p => !search || p.title.toLowerCase().includes(search.toLowerCase()));

    const countByCat = (k) => POSTS.filter(p => p.cat === k).length;

    const Header = (
      <>
        <button className="ad-btn">
          <AdIcon name="download" size={14} /> Xuất CSV
        </button>
        <button className="ad-btn primary">
          <AdIcon name="plus" size={14} /> Bài viết mới
        </button>
      </>
    );

    return (
      <AdPage active="news"
        crumb={[{ label: 'Trang chủ', href: 'index.html' }, { label: 'Tin tức' }]}
        title="Tin tức"
        sub={`${POSTS.length} bài viết · ${POSTS.reduce((s, p) => s + p.views, 0).toLocaleString()} lượt xem tổng · 6 danh mục`}
        actions={Header}>

        <div className="ad-table-wrap">
          <div className="ad-toolbar">
            <div style={{ position: 'relative', width: 280 }}>
              <input className="ad-input" style={{ paddingLeft: 32 }}
                     placeholder="Tìm theo tiêu đề…"
                     value={search} onChange={e => setSearch(e.target.value)} />
              <span style={{ position: 'absolute', left: 10, top: '50%',
                             transform: 'translateY(-50%)', color: 'var(--ad-text-mute)' }}>
                <AdIcon name="search" size={14} />
              </span>
            </div>
            <div style={{ display: 'flex', gap: 4, padding: 3,
                          background: 'var(--ad-line-soft)', borderRadius: 6, flexWrap: 'wrap' }}>
              {[
                ['all',       `Tất cả · ${POSTS.length}`],
                ['business',  `Kinh doanh · ${countByCat('business')}`],
                ['milestone', `Cột mốc · ${countByCat('milestone')}`],
                ['product',   `Sản phẩm · ${countByCat('product')}`],
                ['tech',      `Công nghệ · ${countByCat('tech')}`],
                ['event',     `Sự kiện · ${countByCat('event')}`],
                ['csr',       `CSR · ${countByCat('csr')}`],
              ].map(([k, l]) => (
                <button key={k} onClick={() => setCat(k)}
                        style={{
                          border: 0, background: cat === k ? '#fff' : 'transparent',
                          padding: '4px 11px', borderRadius: 4, fontSize: 12.5, fontWeight: 500,
                          color: cat === k ? 'var(--ad-text)' : 'var(--ad-text-soft)',
                          boxShadow: cat === k ? 'var(--ad-shadow)' : 'none', cursor: 'pointer',
                        }}>{l}</button>
              ))}
            </div>
            <div className="grow" />
            <button className="ad-btn ghost sm">
              <AdIcon name="filter" size={13} /> Lọc thêm
            </button>
          </div>

          <table className="ad-table">
            <thead>
              <tr>
                <th style={{ width: 36 }}><input type="checkbox" /></th>
                <th>Tiêu đề</th>
                <th style={{ width: 130 }}>Danh mục</th>
                <th style={{ width: 90 }}>Tác giả</th>
                <th style={{ width: 110 }}>Ngày đăng</th>
                <th style={{ width: 90 }}>Xem</th>
                <th style={{ width: 80 }}>BL</th>
                <th style={{ width: 130 }}>Trạng thái</th>
                <th style={{ width: 140 }}></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(p => (
                <tr key={p.id}>
                  <td><input type="checkbox" /></td>
                  <td>
                    <div className="nw-title-cell">
                      <img className="nw-thumb" src={p.img} alt="" />
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontWeight: 600, marginBottom: 2,
                                      overflow: 'hidden', textOverflow: 'ellipsis',
                                      whiteSpace: 'nowrap', maxWidth: 460 }}>
                          {p.title}
                        </div>
                        <div style={{ fontSize: 11.5, color: 'var(--ad-text-mute)' }}>
                          ID: {p.id} · /tin-tuc/bai-{p.id}
                        </div>
                      </div>
                    </div>
                  </td>
                  <td>
                    <span className={`nw-cat ${p.cat}`}>{CAT_LABEL[p.cat]}</span>
                  </td>
                  <td>
                    <div style={{
                      width: 22, height: 22, borderRadius: '50%',
                      background: 'var(--ad-primary)', color: '#fff',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      fontWeight: 600, fontSize: 9.5,
                    }}>{p.author}</div>
                  </td>
                  <td style={{ fontSize: 12.5, color: 'var(--ad-text-soft)' }}>{p.date}</td>
                  <td style={{ fontSize: 12.5, color: 'var(--ad-text-soft)' }}>
                    {p.views.toLocaleString()}
                  </td>
                  <td style={{ fontSize: 12.5, color: 'var(--ad-text-soft)' }}>{p.comments}</td>
                  <td><AdBadge status={p.status} /></td>
                  <td>
                    <div className="row-actions" style={{ justifyContent: 'flex-end' }}>
                      <button className="ad-btn ghost sm" title="Sửa"><AdIcon name="edit" size={13} /></button>
                      <a className="ad-btn ghost sm" title="Xem"
                         href={`../news.html#post-${p.id}`} target="_blank">
                        <AdIcon name="eye" size={13} />
                      </a>
                      <button className="ad-btn ghost sm" title="Nhân bản"><AdIcon name="copy" size={13} /></button>
                      <button className="ad-btn ghost sm" title="Thêm"><AdIcon name="more" size={13} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <div className="ad-pag">
            <div>Hiển thị 1 – {filtered.length} của {filtered.length} bài</div>
            <div className="ad-pag-pages">
              <button>‹</button>
              <button className="on">1</button>
              <button>›</button>
            </div>
          </div>
        </div>
      </AdPage>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<NewsList />);
</script>
</body>
</html>
