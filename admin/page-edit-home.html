<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sửa: Trang chủ · Long Anh Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel" src="page-edit-shell.jsx"></script>
<script type="text/babel">
  const style = document.createElement('style');
  style.textContent = ADMIN_GLOBAL_CSS + PAGE_EDIT_CSS;
  document.head.appendChild(style);

  function PageEditHome() {
    const [lang, setLang] = React.useState('vi');
    const [status, setStatus] = React.useState('pub');

    /* Capability cards — đồng bộ với CONTENT.md mục 2.4 */
    const CAPS = [
      { num: '01', name: 'Năng lực sản xuất', img: '../assets/nha-may-bot-sieu-min-3.webp',
        body: '05 nhà máy với tổng diện tích 12ha, dây chuyền hiện đại — công suất đạt trên 350,000 tấn/năm.' },
      { num: '02', name: 'Nguồn nguyên liệu', img: '../assets/da-nguyen-lieu-cao-cap2.webp',
        body: 'Đá vôi trắng nguyên sinh từ Quỳ Hợp – Nghệ An, độ trắng > 98% và CaCO₃ > 98.5% — kiểm soát từ gốc.' },
      { num: '03', name: 'Cơ sở hạ tầng', img: '../assets/co-so-ha-tang.jpg',
        body: 'Hệ thống dây chuyền nghiền và phủ Stearic Acid theo công nghệ Châu Âu, vận hành đồng bộ và ổn định.' },
      { num: '04', name: 'Kiểm định chất lượng', img: '../assets/kiem-dinh.jpg',
        body: 'Phòng QC kiểm tra từng lô — độ trắng, CaCO₃, độ ẩm, cỡ hạt — kèm COA và MSDS theo tiêu chuẩn ISO 9001:2015.' },
      { num: '05', name: 'Đóng gói sản phẩm', img: '../assets/bao-bi-sieu-trang.jpg',
        body: 'Đáp ứng mọi quy cách: PP 25kg/50kg, jumbo 250kg/500kg/1000kg và bulk theo yêu cầu khách hàng.' },
    ];

    /* Export feature cards (mục 2.6 — 4 ô trên map) */
    const EXPORT_FEATURES = [
      { title: 'Chất lượng cao cấp',     body: 'Độ trắng 98%+, CaCO₃ 98.5%+' },
      { title: 'Tầm phủ toàn cầu',       body: '12 quốc gia · 8+ thị trường' },
      { title: 'Logistics tin cậy',      body: 'FOB cảng Cửa Lò & Hải Phòng' },
      { title: 'Niềm tin khách hàng',    body: '10+ năm đối tác dài hạn' },
    ];

    return (
      <PeEditorShell
        active="pages"
        crumb={[
          { label: 'Trang chủ', href: 'index.html' },
          { label: 'Trang', href: 'pages.html' },
          { label: 'Trang chủ' },
        ]}
        title="Trang chủ"
        slug="/"
        status={status} setStatus={setStatus}
        previewHref="../index.html"
        lang={lang} setLang={setLang}>

        {/* 01 — HERO */}
        <PeSection num="01" icon="layers" title="Hero — Banner đầu trang"
                   sub="Eyebrow, tiêu đề 2 dòng, mô tả, 2 nút CTA và ảnh hero">
          <div className="pe-stack">
            <AdField label="Eyebrow (chữ cam nhỏ phía trên)">
              <input className="ad-input" defaultValue="Khoáng sản công nghiệp · Xuất khẩu quốc tế" />
            </AdField>
            <div className="pe-row">
              <AdField label="Tiêu đề dòng 1 (đen)" req>
                <input className="ad-input" defaultValue="Khoáng đá nguyên sinh" />
              </AdField>
              <AdField label="Tiêu đề dòng 2 (cam)" req>
                <input className="ad-input" defaultValue="từ trái tim Nghệ An" />
              </AdField>
            </div>
            <AdField label="Mô tả ngắn dưới tiêu đề">
              <textarea className="ad-textarea" defaultValue="Long Anh chuyên sản xuất bột đá CaCO₃ phủ và không phủ Stearic Acid, đá Slab, đá xẻ quy cách và đá trang trí — phục vụ ngành nhựa, sơn, giấy, xây dựng và xuất khẩu trên toàn cầu." />
            </AdField>
            <div className="pe-row">
              <AdField label="Nút chính (cam) - Chữ"><input className="ad-input" defaultValue="Xem sản phẩm" /></AdField>
              <AdField label="Nút chính - Liên kết"><input className="ad-input" defaultValue="/products.html" /></AdField>
            </div>
            <div className="pe-row">
              <AdField label="Nút phụ (viền) - Chữ"><input className="ad-input" defaultValue="Yêu cầu báo giá" /></AdField>
              <AdField label="Nút phụ - Liên kết"><input className="ad-input" defaultValue="#contact" /></AdField>
            </div>
            <div style={{ borderTop: '1px solid var(--ad-line-soft)', paddingTop: 16 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ad-text-mute)',
                            letterSpacing: '.05em', textTransform: 'uppercase', marginBottom: 10 }}>
                Ảnh hero
              </div>
              <div className="pe-imgrow">
                <PeImg src="../assets/hero-sw.png" label="Ảnh hero" size="2048×1521 · PNG" />
                <div className="pe-stack">
                  <AdField label="Mô tả ảnh (alt text)" help="Quan trọng cho SEO và screen readers">
                    <input className="ad-input" defaultValue="Bao bột đá CaCO₃ Long Anh siêu trắng" />
                  </AdField>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button className="ad-btn"><AdIcon name="upload" size={13} /> Đổi ảnh</button>
                    <button className="ad-btn"><AdIcon name="image" size={13} /> Thư viện</button>
                  </div>
                  <div style={{ fontSize: 12, color: 'var(--ad-text-mute)' }}>
                    Khuyến nghị: PNG nền trong suốt · tối thiểu 1200×900px · &lt; 500KB
                  </div>
                </div>
              </div>
            </div>
          </div>
        </PeSection>

        {/* 02 — STATS */}
        <PeSection num="02" icon="trend" title="Stats — Dải 4 con số"
                   sub="Năm kinh nghiệm, công suất, quốc gia xuất khẩu, số mỏ">
          <div className="pe-row four">
            {[
              { val: '20+',     label: 'Năm kinh nghiệm' },
              { val: '350,000', label: 'Tấn / năm công suất' },
              { val: '12',      label: 'Quốc gia xuất khẩu' },
              { val: '5',       label: 'Mỏ đá vận hành' },
            ].map((s, i) => (
              <div key={i} style={{ background: '#fff', border: '1px solid var(--ad-line)',
                                    borderRadius: 8, padding: 12, display: 'flex',
                                    flexDirection: 'column', gap: 8 }}>
                <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--ad-text-mute)' }}>STAT {i + 1}</span>
                <input className="ad-input" defaultValue={s.val} style={{ fontWeight: 700, fontSize: 18 }} />
                <input className="ad-input" defaultValue={s.label} style={{ fontSize: 12 }} />
              </div>
            ))}
          </div>
        </PeSection>

        {/* 03 — Products carousel */}
        <PeSection num="03" icon="rock" title="Sản phẩm — Năm dòng chính"
                   sub="Carousel sản phẩm dưới hero">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Danh mục sản phẩm" /></AdField>
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Năm dòng sản phẩm chính" /></AdField>
            </div>
            <AdField label="Phụ đề">
              <textarea className="ad-textarea" defaultValue="Tối ưu cho từng ứng dụng — từ filler nhựa siêu mịn đến đá trang trí kích thước lớn." />
            </AdField>
            <AdField label="Cách hiển thị">
              <select className="ad-select">
                <option>Tự động — 5 dòng sản phẩm chính</option>
                <option>Thủ công — chọn sản phẩm cụ thể</option>
              </select>
            </AdField>
            <div style={{ background: '#fff', border: '1px solid var(--ad-line)',
                          borderRadius: 8, padding: 12 }}>
              <div style={{ fontSize: 12, color: 'var(--ad-text-mute)', marginBottom: 8 }}>
                5 sản phẩm đang hiển thị
              </div>
              <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                {['P-01 · Bột CaCO₃ không phủ', 'P-02 · Bột CaCO₃ phủ Stearic',
                  'P-03 · Đá Slab', 'P-04 · Đá xẻ quy cách', 'P-05 · Đá trang trí'].map(p => (
                  <span key={p} className="ad-tag">
                    {p}<button><AdIcon name="x" size={11} /></button>
                  </span>
                ))}
              </div>
            </div>
          </div>
        </PeSection>

        {/* 04 — ABOUT 5 cards */}
        <PeSection num="04" icon="grid" title="Về Long Anh — Lưới 5 ô năng lực"
                   sub="Năng lực sản xuất · Nguồn nguyên liệu · Hạ tầng · QC · Đóng gói">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Về chúng tôi" /></AdField>
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Khai thác bền vững. Chế biến chính xác. Giao hàng đúng hẹn." /></AdField>
            </div>
            <AdField label="Đoạn intro">
              <textarea className="ad-textarea" defaultValue="Khởi nguồn từ vùng đá vôi trắng Quỳ Hợp – Nghệ An, Long Anh sở hữu mỏ nguyên liệu chất lượng cao với độ trắng vượt 98% và hàm lượng CaCO₃ trên 98,5%." />
            </AdField>

            <div className="pe-card-grid">
              {CAPS.map((c, i) => (
                <div key={i} className="pe-card-edit">
                  <div className="head">
                    <span className="pill">CARD {c.num}</span>
                    <div className="name">{c.name}</div>
                    <button title="Kéo"><AdIcon name="drag" size={14} /></button>
                    <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                  </div>
                  <div className="miniimg">
                    <img src={c.img} alt={c.name} />
                  </div>
                  <AdField label="Tên card">
                    <input className="ad-input" defaultValue={c.name} />
                  </AdField>
                  <AdField label="Mô tả">
                    <textarea className="ad-textarea" defaultValue={c.body} style={{ minHeight: 60 }} />
                  </AdField>
                </div>
              ))}
              <button className="pe-add-card">
                <AdIcon name="plus" size={20} />
                Thêm card mới
              </button>
            </div>
          </div>
        </PeSection>

        {/* 05 — Certs */}
        <PeSection num="05" icon="shield" title="Chứng nhận quốc tế — 4 thẻ"
                   sub="ISO 9001 · REACH · SGS · MSDS">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Chứng chỉ" /></AdField>
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Đạt chuẩn chất lượng quốc tế." /></AdField>
            </div>
            <AdField label="Phụ đề">
              <textarea className="ad-textarea" defaultValue="Mỗi lô sản phẩm đều được kiểm tra QC theo ISO 9001, kèm COA và MSDS — đáp ứng yêu cầu khắt khe nhất từ thị trường Hàn Quốc, Nhật Bản, Ấn Độ và Trung Đông." />
            </AdField>
            <div className="pe-list">
              {[
                ['ISO 9001:2015', 'Hệ thống quản lý chất lượng',                '../assets/cert-iso-9001.svg'],
                ['REACH',         'Tuân thủ hóa chất Châu Âu',                  '../assets/cert-reach.svg'],
                ['SGS',           'Kiểm định độc lập độ trắng & cỡ hạt',        '../assets/cert-sgs.svg'],
                ['MSDS',          'Phiếu an toàn hóa chất sản phẩm',            '../assets/cert-msds.svg'],
              ].map((r, i) => (
                <div key={i} className="pe-list-item">
                  <span className="num">0{i + 1}</span>
                  <div style={{ display: 'grid', gridTemplateColumns: '0.6fr 1.5fr 1fr', gap: 8 }}>
                    <input className="ad-input" defaultValue={r[0]} placeholder="Tên cert" />
                    <input className="ad-input" defaultValue={r[1]} placeholder="Mô tả" />
                    <input className="ad-input" defaultValue={r[2]} placeholder="Đường dẫn logo" />
                  </div>
                  <div className="actions">
                    <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </PeSection>

        {/* 06 — Export capability + map */}
        <PeSection num="06" icon="globe" title="Năng lực xuất khẩu — Map + 4 feature cards"
                   sub={'Section "Sẵn sàng cho thị trường quốc tế"'}>
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Năng lực xuất khẩu" /></AdField>
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Sẵn sàng cho thị trường quốc tế" /></AdField>
            </div>
            <AdField label="Phụ đề">
              <textarea className="ad-textarea" defaultValue="Hệ thống đóng gói đa dạng từ bao 25 kg, jumbo bag 1 tấn đến container rời. Giao hàng FOB cảng Cửa Lò & Hải Phòng." />
            </AdField>

            <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ad-text-mute)',
                          letterSpacing: '.05em', textTransform: 'uppercase' }}>
              4 thẻ tính năng trên map
            </div>
            <div className="pe-row">
              {EXPORT_FEATURES.slice(0, 2).map((f, i) => (
                <div key={i} style={{ background: '#fff', border: '1px solid var(--ad-line)',
                                      borderRadius: 8, padding: 12, display: 'flex',
                                      flexDirection: 'column', gap: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--ad-text-mute)' }}>
                    EF 0{i + 1}
                  </span>
                  <input className="ad-input" defaultValue={f.title} />
                  <input className="ad-input" defaultValue={f.body} style={{ fontSize: 12 }} />
                </div>
              ))}
            </div>
            <div className="pe-row">
              {EXPORT_FEATURES.slice(2, 4).map((f, i) => (
                <div key={i} style={{ background: '#fff', border: '1px solid var(--ad-line)',
                                      borderRadius: 8, padding: 12, display: 'flex',
                                      flexDirection: 'column', gap: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: 'var(--ad-text-mute)' }}>
                    EF 0{i + 3}
                  </span>
                  <input className="ad-input" defaultValue={f.title} />
                  <input className="ad-input" defaultValue={f.body} style={{ fontSize: 12 }} />
                </div>
              ))}
            </div>

            <AdField label="Danh sách thị trường (markers trên map)">
              <PeTags tags={['Hàn Quốc', 'Nhật Bản', 'Ấn Độ', 'Bangladesh',
                              'Indonesia', 'UAE', 'Ai Cập', 'Thổ Nhĩ Kỳ']} />
            </AdField>
            <AdField label="Caption dưới map">
              <input className="ad-input"
                     defaultValue="Từ nhà máy của chúng tôi đến cảng của bạn — giao hàng chất lượng, xây dựng niềm tin." />
            </AdField>
          </div>
        </PeSection>

        {/* 07 — Contact form */}
        <PeSection num="07" icon="mail" title="Liên hệ — Form cuối trang"
                   sub="Block CTA + form liên hệ" defaultOpen={false}>
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="Liên hệ" /></AdField>
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Hãy bắt đầu từ một câu hỏi." /></AdField>
            </div>
            <AdField label="Phụ đề">
              <textarea className="ad-textarea" defaultValue="Đội ngũ kinh doanh phản hồi trong vòng 24h làm việc — kèm bảng spec, COA và báo giá FOB." />
            </AdField>
            <div className="pe-row">
              <AdField label="Email nhận liên hệ" req>
                <input className="ad-input" defaultValue="info@longanhcorp.com" />
              </AdField>
              <AdField label="Hotline hiển thị">
                <input className="ad-input" defaultValue="(+84) 912 779 799" />
              </AdField>
            </div>
            <AdField label="Địa chỉ trụ sở">
              <input className="ad-input"
                     defaultValue="Số D1-22, Đường 2K, Khu Đô Thị Cửa Tiền, P. Vinh Tân, TP. Vinh, Nghệ An" />
            </AdField>
          </div>
        </PeSection>

        {/* 08 — SEO */}
        <PeSeoSection
          num="08"
          metaTitle="KS Long Anh — Bột đá CaCO₃ & Đá tự nhiên Việt Nam"
          metaDesc="Long Anh sản xuất bột đá CaCO₃ phủ/không phủ Stearic Acid, đá Slab, đá xẻ và đá trang trí từ mỏ Quỳ Hợp — Nghệ An. Xuất khẩu 12 quốc gia."
          keywords={['bột đá', 'CaCO3', 'KS Long Anh', 'caco3 việt nam', 'đá Slab', 'Quỳ Hợp Nghệ An', 'bột đá phủ Stearic']}
          ogImage="../assets/nha-may-bot-sieu-min-3.webp"
          googleSlug="trang chủ" />

      </PeEditorShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PageEditHome />);
</script>
</body>
</html>
