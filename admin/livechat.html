            <div className="lc-rows">
              {filtered.map(c => (
                <div key={c.id} className={`lc-row ${c.id === selId ? 'on' : ''}`}
                     onClick={() => setSelId(c.id)}>
                  <div className="av-wrap">
                    <div className="av">{c.av}</div>
                    <span className={`status-dot ${c.status}`} />
                  </div>
                  <div className="body">
                    <div className="top">
                      <span className="name">{c.name}</span>
                      <span className="when">{c.when}</span>
                    </div>
                    <div className="preview">{c.last}</div>
                    <div className="meta">
                      <span className={`chan ${c.chan}`}>
                        {({web: 'Webchat', zalo: 'Zalo', fb: 'Facebook', email: 'Email'})[c.chan]}
                      </span>
                      <span style={{ fontSize: 11, color: 'var(--ad-text-mute)',
                                     overflow: 'hidden', textOverflow: 'ellipsis',
                                     whiteSpace: 'nowrap' }}>{c.company}</span>
                    </div>
                  </div>
                  {c.unread > 0 && <span className="unread">{c.unread}</span>}
                </div>
              ))}
              {filtered.length === 0 && (
                <div style={{ padding: 32, textAlign: 'center', color: 'var(--ad-text-mute)', fontSize: 13 }}>
                  Không có cuộc trò chuyện nào phù hợp.
                </div>
              )}
            </div>
          </div>

          {/* MIDDLE — Active chat thread */}
          <div className="lc-chat">
            <div className="lc-chat-head">
              <div className="av-wrap" style={{ position: 'relative' }}>
                <div className="av">{sel.av}</div>
                <span className={`status-dot ${sel.status}`}
                      style={{ position: 'absolute', right: -1, bottom: -1,
                               width: 11, height: 11, borderRadius: '50%',
                               border: '2px solid #fff',
                               background: sel.status === 'online' ? 'var(--ad-success)'
                                         : sel.status === 'typing' ? 'var(--ad-warn)'
                                         : 'var(--ad-text-mute)' }} />
              </div>
              <div className="info">
                <div className="n">{sel.name}</div>
                <div className="s">
                  {sel.status === 'online' ? 'Đang trực tuyến'
                   : sel.status === 'typing' ? 'Đang nhập tin…'
                   : 'Offline · hoạt động cuối ' + sel.when} · {sel.company}
                </div>
              </div>
              <div className="actions">
                <button title="Gọi"><AdIcon name="bell" size={16} /></button>
                <button title="Gửi email"><AdIcon name="mail" size={16} /></button>
                <button title="Chuyển nhân viên khác"><AdIcon name="users" size={16} /></button>
                <button title="Thêm"><AdIcon name="more" size={16} /></button>
              </div>
            </div>

            <div className="lc-msgs" ref={msgsRef}>
              <div className="lc-day">Hôm nay</div>
              {thread.map((m, i) => (
                <React.Fragment key={i}>
                  <div className={`lc-msg ${m.who}`}>{m.text}</div>
                  <div className={`lc-msg-time ${m.who}`}>{m.when}</div>
                </React.Fragment>
              ))}
              {sel.status === 'typing' && (
                <div className="lc-typing"><span /><span /><span /></div>
              )}
            </div>

            <div className="lc-templates">
              <span className="lbl">Mẫu trả lời:</span>
              {TEMPLATES.map((t, i) => (
                <button key={i} className="lc-template" onClick={() => fillTemplate(t)}
                        title={t}>
                  {t.length > 38 ? t.slice(0, 38) + '…' : t}
                </button>
              ))}
            </div>

            <div className="lc-input">
              <div className="tools">
                <button title="Đính kèm tệp"><AdIcon name="upload" size={17} /></button>
                <button title="Gửi ảnh"><AdIcon name="image" size={17} /></button>
                <button title="Liên kết"><AdIcon name="link" size={17} /></button>
                <button title="Emoji" style={{ fontSize: 16 }}>😊</button>
              </div>
              <textarea placeholder="Nhập tin nhắn… (Enter để gửi, Shift+Enter để xuống dòng)"
                        value={draft}
                        onChange={e => setDraft(e.target.value)}
                        onKeyDown={e => {
                          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
                        }} />
              <button className="ad-btn primary" onClick={sendMsg} disabled={!draft.trim()}>
                <AdIcon name="arrowRight" size={14} /> Gửi
              </button>
            </div>
          </div>

          {/* RIGHT — Customer info */}
          <aside className="lc-side">
            <div className="av-big">{sel.av}</div>
            <div className="name-big">{sel.name}</div>
            <div className="role-big">{sel.company}</div>

            <div className="lc-actions">
              <button><AdIcon name="check" size={13} /> Đã xử lý</button>
              <button><AdIcon name="star" size={13} /> Ghim</button>
              <button className="full"><AdIcon name="mail" size={13} /> Tạo phiếu liên hệ trong CRM</button>
            </div>

            <div className="lc-card">
              <div className="lc-card-head">Thông tin liên hệ</div>
              <div className="lc-card-body">
                <div className="kv"><span className="key">Email</span><span className="val">{sel.email}</span></div>
                <div className="kv"><span className="key">SĐT</span>  <span className="val">{sel.phone}</span></div>
                <div className="kv"><span className="key">Khu vực</span><span className="val">{sel.country}</span></div>
              </div>
            </div>

            <div className="lc-card">
              <div className="lc-card-head">Hành trình khách</div>
              <div className="lc-card-body">
                <div className="kv"><span className="key">Lần đầu</span><span className="val">{sel.firstSeen}</span></div>
                <div className="kv"><span className="key">Page views</span><span className="val">{sel.pageViews}</span></div>
                <div className="kv"><span className="key">Số chat</span><span className="val">{sel.conversations} cuộc</span></div>
              </div>
            </div>

            <div className="lc-card">
              <div className="lc-card-head">Tag</div>
              <div className="lc-card-body">
                {sel.tags.map(t => <span key={t} className="lc-tag">{t}</span>)}
                <button style={{ fontSize: 11, padding: '2px 8px', borderRadius: 99,
                                  border: '1px dashed var(--ad-line)',
                                  background: 'transparent', color: 'var(--ad-text-mute)',
                                  cursor: 'pointer', marginLeft: 4 }}>
                  + Thêm tag
                </button>
              </div>
            </div>

            <div className="lc-card">
              <div className="lc-card-head">Ghi chú nội bộ</div>
              <div className="lc-card-body">
                <textarea
                  placeholder="Note để team biết tình trạng khách…"
                  defaultValue={sel.id === 1 ? 'Khách hỏi 5 µm, hợp đồng 6 tháng. Đã forward cho a. Hùng — KD.' : ''}
                  style={{ width: '100%', minHeight: 64, fontSize: 12.5,
                            border: '1px solid var(--ad-line)', borderRadius: 6,
                            padding: '8px 10px', resize: 'vertical', outline: 'none' }} />
              </div>
            </div>
          </aside>
        </div>
      </AdPage>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<LiveChat />);
</script>
</body>
</html>
