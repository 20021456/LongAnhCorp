<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sửa: Ứng dụng sản phẩm · Long Anh Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="admin-shell.jsx"></script>
<script type="text/babel" src="page-edit-shell.jsx"></script>
<script type="text/babel">
  const style = document.createElement('style');
  style.textContent = ADMIN_GLOBAL_CSS + PAGE_EDIT_CSS;
  document.head.appendChild(style);

  function PageEditApps() {
    const [lang, setLang] = React.useState('vi');
    const [status, setStatus] = React.useState('draft');

    const APPS = [
      { name: 'Nhựa & Polymer', img: '../assets/bot-sieu-min.webp',
        body: 'Bột đá phủ Stearic dùng làm filler cho PE, PP, PVC compound — tăng độ cứng, giảm chi phí, ổn định kích thước.' },
      { name: 'Sơn & Phủ', img: '../assets/bot-caco3-sieu-min.webp',
        body: 'Bột không phủ siêu mịn cho sơn nước, sơn dầu, mastic và lớp phủ công nghiệp.' },
      { name: 'Cao su', img: '../assets/da-nguyen-lieu-cao-cap.webp',
        body: 'Filler chất lượng cao cho công nghiệp cao su tự nhiên và cao su tổng hợp.' },
      { name: 'Giấy', img: '../assets/da-nguyen-lieu-cao-cap2.webp',
        body: 'Coating và filler cho giấy in, giấy bao bì — cải thiện độ trắng và độ mịn bề mặt.' },
      { name: 'Gạch men & Sứ', img: '../assets/da-slab-sieu-trang.webp',
        body: 'Nguyên liệu chính trong xương gạch và men gạch — đảm bảo độ trắng và tính ổn định nhiệt.' },
      { name: 'Xây dựng', img: '../assets/co-so-ha-tang.jpg',
        body: 'Vữa khô, keo dán gạch, putty và phụ gia bê tông — yêu cầu độ ổn định cao.' },
    ];

    const CASES = [
      { client: 'Tập đoàn nhựa A · Hàn Quốc', metric: '12,000 tấn/năm · PP compound',
        body: 'Chuyển đổi từ filler nhập khẩu sang bột phủ Stearic Long Anh — giảm 18% chi phí nguyên liệu.' },
      { client: 'Nhà máy sơn B · Việt Nam', metric: '4,500 tấn/năm · sơn nước',
        body: 'Tăng độ trắng bề mặt 6 điểm L* nhờ chuyển sang bột uncoated D50 5µm.' },
      { client: 'Nhà sản xuất giấy C · Nhật Bản', metric: '8,000 tấn/năm · coating',
        body: 'Đạt yêu cầu độ trắng > 96% và ổn định lô qua 24 tháng vận hành liên tục.' },
    ];

    return (
      <PeEditorShell
        active="pages"
        crumb={[
          { label: 'Trang chủ', href: 'index.html' },
          { label: 'Trang', href: 'pages.html' },
          { label: 'Ứng dụng sản phẩm' },
        ]}
        title="Ứng dụng sản phẩm"
        slug="/ung-dung"
        status={status} setStatus={setStatus}
        previewHref="#"
        lang={lang} setLang={setLang}>

        {/* 01 — Page header */}
        <PeSection num="01" icon="layers" title="Page header — Banner trang"
                   sub="Eyebrow, tiêu đề, mô tả">
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Eyebrow"><input className="ad-input" defaultValue="// Ứng dụng · 04" /></AdField>
              <AdField label="Tiêu đề chính" req>
                <input className="ad-input" defaultValue="Có mặt trong mọi sản phẩm bạn dùng mỗi ngày." />
              </AdField>
            </div>
            <AdField label="Mô tả ngắn">
              <textarea className="ad-textarea" defaultValue="Bột đá Long Anh được sử dụng làm phụ gia trong sáu ngành công nghiệp lớn — từ nhựa, sơn, cao su, giấy, đến gạch men và xây dựng." />
            </AdField>
          </div>
        </PeSection>

        {/* 02 — Industries */}
        <PeSection num="02" icon="grid" title="Lưới ứng dụng theo ngành"
                   sub="6 ô — mỗi ô là một ngành công nghiệp">
          <div className="pe-card-grid">
            {APPS.map((a, i) => (
              <div key={i} className="pe-card-edit">
                <div className="head">
                  <span className="pill">APP 0{i + 1}</span>
                  <div className="name">{a.name}</div>
                  <button title="Kéo"><AdIcon name="drag" size={14} /></button>
                  <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                </div>
                <div className="miniimg"><img src={a.img} alt={a.name} /></div>
                <AdField label="Tên ngành"><input className="ad-input" defaultValue={a.name} /></AdField>
                <AdField label="Mô tả"><textarea className="ad-textarea" defaultValue={a.body} style={{ minHeight: 60 }} /></AdField>
                <AdField label="Sản phẩm liên kết">
                  <PeTags tags={i === 0 ? ['Bột phủ Stearic'] : i === 1 ? ['Bột không phủ'] : ['Bột phủ Stearic', 'Bột không phủ']} />
                </AdField>
              </div>
            ))}
            <button className="pe-add-card">
              <AdIcon name="plus" size={20} />
              Thêm ngành ứng dụng
            </button>
          </div>
        </PeSection>

        {/* 03 — Case studies */}
        <PeSection num="03" icon="trend" title="Case studies — Khách hàng tiêu biểu"
                   sub="Số liệu ngắn cho mỗi case (ẩn tên thật nếu yêu cầu)">
          <div className="pe-stack">
            {CASES.map((c, i) => (
              <div key={i} className="pe-card-edit">
                <div className="head">
                  <span className="pill">CASE 0{i + 1}</span>
                  <div className="name">{c.client}</div>
                  <button title="Xóa"><AdIcon name="trash" size={13} /></button>
                </div>
                <div className="pe-row">
                  <AdField label="Khách hàng"><input className="ad-input" defaultValue={c.client} /></AdField>
                  <AdField label="Số liệu / quy mô"><input className="ad-input" defaultValue={c.metric} /></AdField>
                </div>
                <AdField label="Tóm tắt"><textarea className="ad-textarea" defaultValue={c.body} style={{ minHeight: 60 }} /></AdField>
                <AdField label="Ẩn tên khách hàng">
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                    <AdSwitch on={i === 0} onChange={() => {}} />
                    <span style={{ fontSize: 12.5, color: 'var(--ad-text-mute)' }}>Hiển thị "Tập đoàn nhựa A" thay vì tên thật</span>
                  </div>
                </AdField>
              </div>
            ))}
            <button className="ad-btn" style={{ width: 'fit-content' }}>
              <AdIcon name="plus" size={13} /> Thêm case study
            </button>
          </div>
        </PeSection>

        {/* 04 — CTA */}
        <PeSection num="04" icon="mail" title="CTA cuối trang"
                   sub="Block kêu gọi tư vấn ứng dụng" defaultOpen={false}>
          <div className="pe-stack">
            <div className="pe-row">
              <AdField label="Tiêu đề"><input className="ad-input" defaultValue="Cần tư vấn loại bột phù hợp cho ứng dụng của bạn?" /></AdField>
              <AdField label="Email nhận"><input className="ad-input" defaultValue="tech@long-anh.com" /></AdField>
            </div>
            <AdField label="Mô tả">
              <textarea className="ad-textarea" defaultValue="Đội kỹ thuật của Long Anh có thể đề xuất cỡ hạt và mức phủ Stearic phù hợp với compound, sơn hoặc giấy của bạn." />
            </AdField>
          </div>
        </PeSection>

        {/* 05 — SEO */}
        <PeSeoSection
          num="05"
          metaTitle="Ứng dụng bột đá CaCO₃ Long Anh — Nhựa, Sơn, Giấy, Cao su"
          metaDesc="Bột đá Long Anh dùng làm filler cho 6 ngành công nghiệp: nhựa & polymer, sơn, cao su, giấy, gạch men và xây dựng."
          keywords={['ứng dụng bột đá', 'CaCO3 cho nhựa', 'filler PVC', 'bột đá sơn nước', 'CaCO3 cho giấy']}
          ogImage="../assets/bot-sieu-min.webp"
          googleSlug="ứng dụng" />

      </PeEditorShell>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PageEditApps />);
</script>
</body>
</html>
