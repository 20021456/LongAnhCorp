function App() {

  const C = COPY[t.lang];
  // Read URL hash to pre-set category: #powder → 0 (CaCO₃), #stone → 1 (natural stone)
  const initialCat = (() => {
    if (typeof window === 'undefined') return null;
    const h = window.location.hash;
    if (h === '#powder') return 0;
    if (h === '#stone') return 1;
    return null;
  })();
  const [activeCat, setActiveCat] = React.useState(initialCat);
  // Re-sync when hash changes (so clicking dropdown items on the same page works)
  React.useEffect(() => {
    const onHash = () => {
      const h = window.location.hash;
      if (h === '#powder') setActiveCat(0);
      else if (h === '#stone') setActiveCat(1);
      else setActiveCat(null);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const cssVars = { '--brand-primary':t.primary, '--brand-accent':t.accent, '--va-font':t.font, '--va-display':t.font };
  const cats = C.catTitles;
  const filtered = activeCat===null ? C.products : C.products.filter(p => p.cat === activeCat);
  const byCat = [0,1].map(ci => ({
    ci,
    title: cats[ci],
    products: filtered.filter(p => p.cat === ci),
  })).filter(g => g.products.length > 0);

  return (
    <div className={'vac pr '+(t.dark?'dark':'')} style={cssVars}>
      <style>{CHROME_CSS}</style>
      <style>{PR_CSS}</style>
      <VAHeader tweaks={tweaks} current="products"/>
      <VAPageHeader
        eyebrow={C.productsEy}
        title={t.lang==='zh'?'两大产品系列。五个标准。':t.lang==='en'?'Two product lines. Five SKUs.':'Hai dòng sản phẩm. Năm tiêu chuẩn.'}
        sub={t.lang==='zh'
          ?'从塑料复合材料用的超细碳酸钙粉,到高端项目用的大尺寸天然石材 — 全部来自同一矿源。'
          :t.lang==='en'
          ?'From ultra-fine CaCO₃ for plastic compounds, to large-format natural stone for premium projects — all from a single quarry.'
          :'Từ bột đá CaCO₃ siêu mịn cho compound nhựa, đến đá tự nhiên cỡ lớn cho công trình cao cấp — tất cả đều đến từ một mỏ duy nhất.'}
        breadcrumb={[
          { label: t.lang==='zh'?'首页':t.lang==='en'?'Home':'Trang chủ', href:'index.html' },
          { label: C.nav[2] },
        ]}/>

      {/* STATS STRIP */}
      <section className="pr-stats">
        <div className="pr-stat">
          <b>05</b>
          <span>{t.lang==='zh'?'核心产品系列':t.lang==='en'?'Core product lines':'Dòng sản phẩm chính'}</span>
        </div>
        <div className="pr-stat">
          <b>98%+</b>
          <span>{t.lang==='zh'?'白度':t.lang==='en'?'Whiteness':'Độ trắng CaCO₃'}</span>
        </div>
        <div className="pr-stat">
          <b>3–20µm</b>
          <span>{t.lang==='zh'?'粒径范围':t.lang==='en'?'Particle range':'Cỡ hạt'}</span>
        </div>
        <div className="pr-stat">
          <b>12</b>
          <span>{t.lang==='zh'?'出口市场':t.lang==='en'?'Export markets':'Thị trường xuất khẩu'}</span>
        </div>
      </section>

      {/* CATEGORY TILES */}
      <section className="pr-section tight">
        <div className="pr-wrap">
          <div className="pr-cat-tiles">
            {[
              { id:'powder', img:'assets/bot-caco3-sieu-min.webp', cat:0,
                titleVi:'Bột đá CaCO₃', titleEn:'CaCO₃ powder', titleZh:'碳酸钙粉',
                descVi:'Coated · Uncoated · 3–20 µm — phụ gia cho nhựa, sơn, giấy, thức ăn chăn nuôi.',
                descEn:'Coated · Uncoated · 3–20 µm — additive for plastics, paint, paper, animal feed.',
                descZh:'涂层 · 未涂层 · 3–20 µm — 用于塑料、涂料、纸张、动物饲料的添加剂。' },
              { id:'stone', img:'assets/da-slab-sieu-trang.webp', cat:1,
                titleVi:'Đá ốp lát tự nhiên', titleEn:'Natural cladding stone', titleZh:'天然石材饰面',
                descVi:'Slab · Đá xẻ · Đá trang trí — cho công trình và không gian sống cao cấp.',
                descEn:'Slab · Cut tile · Decorative — for premium architecture and living spaces.',
                descZh:'大板 · 定制石材 · 装饰石材 — 用于高端建筑和生活空间。' },
            ].map((tile, ti) => {
              const cnt = C.products.filter(p => p.cat === tile.cat).length;
              return (
                <a key={tile.id} href={'#cat-' + tile.id} className="pr-cat-tile"
                   onClick={(e)=>{ e.preventDefault(); setActiveCat(tile.cat);
                     window.location.hash = tile.id === 'powder' ? 'powder' : 'stone';
                     setTimeout(()=>document.getElementById('cat-' + tile.id)?.scrollIntoView({behavior:'smooth',block:'start'}), 50); }}>
                  <img src={tile.img} alt="" className="pr-cat-tile-img"/>
                  <div className="pr-cat-tile-overlay"/>
                  <div className="pr-cat-tile-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"
                         strokeLinejoin="round" style={{color:'#fff'}}>
                      <path d="M5 12h14M13 6l6 6-6 6"/>
                    </svg>
                  </div>
                  <div className="pr-cat-tile-body">
                    <div className="pr-cat-tile-num">— 0{ti+1} · {cnt} {t.lang==='zh'?'款':t.lang==='en'?'SKUs':'sản phẩm'}</div>
                    <h3>{t.lang==='zh'?tile.titleZh:t.lang==='en'?tile.titleEn:tile.titleVi}</h3>
                    <p>{t.lang==='zh'?tile.descZh:t.lang==='en'?tile.descEn:tile.descVi}</p>
                  </div>
                </a>
              );
            })}
          </div>
        </div>
      </section>

      {/* PRODUCTS BY CATEGORY */}
      <section className="pr-section">
        <div className="pr-wrap">
          {byCat.map((group, gi) => (
            <div key={group.ci} className="pr-cat-block" id={'cat-' + (group.ci===0?'powder':'stone')}>
              <div className="pr-cat-head">
                <div>
                  <div className="pr-cat-head-meta">— 0{group.ci+1} · {group.products.length} {t.lang==='zh'?'款产品':t.lang==='en'?'products':'sản phẩm'}</div>
                  <h2>{group.ci===0
                    ? (t.lang==='zh'?'从原始石灰岩 — 到工业用细粉':t.lang==='en'?'From raw limestone — to fine powder for industry':'Từ đá vôi nguyên sinh — đến bột mịn cho công nghiệp')
                    : (t.lang==='zh'?'天然石材 — 用于建筑和生活空间':t.lang==='en'?'Natural stone — for architecture and living spaces':'Đá tự nhiên — cho công trình và không gian sống')}</h2>
                </div>
                <p>{group.ci===0
                  ? (t.lang==='zh'
                    ?'我们的碳酸钙粉是从义安省归合矿场的原始白石灰岩研磨加工而成 — 白度超过98%,碳酸钙含量超过98.5%。粒径范围3至20微米,用作多个行业的添加剂。'
                    :t.lang==='en'
                    ?'Our CaCO₃ powder is milled from pristine white limestone at our Quy Hop quarry in Nghe An — whiteness above 98% and CaCO₃ content above 98.5%. Particle sizes range from 3 to 20 µm, used as an additive across many industries.'
                    :'Sản phẩm bột đá CaCO₃ được nghiền từ đá vôi trắng nguyên sinh tại Quỳ Hợp – Nghệ An, độ trắng > 98% và CaCO₃ > 98.5%. Cỡ hạt 3–20 µm, dùng làm phụ gia cho nhiều ngành công nghiệp.')
                  : (t.lang==='zh'
                    ?'龙英天然石材在矿场直接开采加工 — 确保品质均匀和稳定供应。包括大板、定制石材和装饰石材,提供多种表面饰面选择。'
                    :t.lang==='en'
                    ?'Long Anh natural stone is mined and processed in-house — ensuring consistent quality and reliable supply. Includes large-format Slab, cut-to-size tile and decorative outdoor stone with various finishes.'
                    :'Đá tự nhiên Long Anh được khai thác và chế biến trực tiếp tại mỏ — đảm bảo chất lượng đồng đều, nguồn cung ổn định. Gồm đá Slab tấm lớn, đá xẻ quy cách và đá trang trí ngoại thất với nhiều hoàn thiện.')}</p>
              </div>

              <div className="pr-grid">
                {group.products.map((p, i) => (
                  <a key={i} className="pr-card" href={'product.html?code='+p.code}
                     style={{textDecoration:'none',color:'inherit'}}>
                    <div className="pr-card-img">
                      <img src={p.img} alt={p.name}/>
                      <div className="pr-card-badge">{p.code}</div>
                      <div className="pr-card-cat">{cats[p.cat]}</div>
                    </div>
                    <div className="pr-card-body">
                      <h3>{p.name}</h3>
                      <p>{p.desc}</p>
                      <div className="pr-card-tags">
                        {p.tags.map((tag, j) => <span key={j}>{tag}</span>)}
                      </div>
                      <div className="pr-card-foot">
                        <div className="pr-card-foot-cell">
                          <div className="lbl">{t.lang==='zh'?'白度':t.lang==='en'?'Whiteness':'Độ trắng'}</div>
                          <div className="val">{p.cat===0?'≥ 98%':'90–95%'}</div>
                        </div>
                        <div className="pr-card-foot-cell">
                          <div className="lbl">{t.lang==='zh'?'包装':t.lang==='en'?'Packaging':'Đóng gói'}</div>
                          <div className="val">{p.cat===0?'25kg / 1T':'Crate / pallet'}</div>
                        </div>
                        <div className="pr-card-cta">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                               stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"
                               strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                        </div>
                      </div>
                    </div>
                  </a>
                ))}
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* PARTICLE SIZE VISUALIZER */}
      {(activeCat===null || activeCat===0) && (
        <section className="pr-sizes-section">
          <div className="pr-wrap">
            <div style={{textAlign:'center',marginBottom:48,maxWidth:680,marginInline:'auto'}}>
              <div className="pr-eyebrow">{t.lang==='zh'?'粒径选择':t.lang==='en'?'Particle sizes':'Cỡ hạt khả dụng'}</div>
              <h2 style={{fontSize:'clamp(26px,3vw,38px)'}}>{t.lang==='zh'?'从超细到标准 — 选择适合您应用的粒径':t.lang==='en'?'From ultra-fine to standard — pick the size for your application':'Từ siêu mịn đến tiêu chuẩn — chọn cỡ hạt phù hợp ứng dụng'}</h2>
            </div>
            {[
              { name: t.lang==='zh'?'未涂层':t.lang==='en'?'Uncoated':'Bột không phủ',
                sub: t.lang==='zh'?'8 种规格':t.lang==='en'?'8 sizes':'8 quy cách',
                eyebrow: 'CaCO₃ ≥ 98.5%',
                values: [5, 8, 10, 12, 15, 17, 18, 20] },
              { name: t.lang==='zh'?'硬脂酸涂层':t.lang==='en'?'Stearic-coated':'Bột phủ Stearic',
                sub: t.lang==='zh'?'7 种规格':t.lang==='en'?'7 sizes':'7 quy cách',
                eyebrow: '+ Stearic 1.0–1.5%',
                values: [5, 10, 12, 15, 17, 18, 20] },
            ].map((row, ri) => (
              <div key={ri} className="pr-sizes-row">
                <div className="pr-sizes-label">
                  <div className="pr-sizes-label-eyebrow">{row.eyebrow}</div>
                  <h4>{row.name}</h4>
                  <span>{row.sub}</span>
                </div>
                <div className="pr-sizes-viz">
                  {row.values.map(v => {
                    const size = 22 + (v - 5) * 3.6;
                    return (
                      <div key={v} className="pr-size-circle">
                        <div className="pr-size-circle-dot" style={{width:size,height:size}}>
                          {v < 13 ? v : ''}
                        </div>
                        <div className="pr-size-circle-label">{v} µm</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </section>
      )}

      {/* SPEC TABLE */}
      <section className="pr-spec-section">
        <div className="pr-wrap">
          <div className="pr-spec-head">
            <div className="pr-eyebrow">{t.lang==='zh'?'技术规格':t.lang==='en'?'Technical specifications':'Thông số kỹ thuật'}</div>
            <h2>{t.lang==='zh'?'质量指标 — 碳酸钙粉':t.lang==='en'?'Quality specifications — CaCO₃ powder':'Chỉ tiêu chất lượng — Bột đá CaCO₃'}</h2>
          </div>
          <div className="pr-spec-card">
            <div className="pr-spec-table">
              {SPECS[t.lang].head.map((h, i) => (
                <div key={'h'+i} className="pr-spec-cell h">{h}</div>
              ))}
              {SPECS[t.lang].rows.map((row, ri) => [
                <div key={'l'+ri} className="pr-spec-cell label">{row[0]}</div>,
                <div key={'a'+ri} className="pr-spec-cell num">{row[1]}</div>,
                <div key={'b'+ri} className="pr-spec-cell num">{row[2]}</div>,
                <div key={'u'+ri} className="pr-spec-cell unit">{row[3]}</div>,
              ])}
            </div>
            <div className="pr-spec-foot">
              <span className="pr-spec-foot-chip">ISO 9001:2015</span>
              <span className="pr-spec-foot-chip">REACH</span>
              <span className="pr-spec-foot-chip">SGS</span>
              <span>·</span>
              <span>{t.lang==='zh'?'每批生产均提供COA和MSDS':t.lang==='en'?'Each batch ships with COA and MSDS':'Mỗi lô sản xuất kèm COA và MSDS'}</span>
            </div>
          </div>
        </div>
      </section>

      {/* QUOTE CTA */}
      <section className="pr-quote-section">
        <div className="pr-wrap">
          <div className="pr-quote">
            <div>
              <div className="pr-eyebrow">{t.lang==='zh'?'快速报价':t.lang==='en'?'Quick quote':'Báo giá nhanh'}</div>
              <h2>{t.lang==='zh'?'需要下次发货的FOB报价?':t.lang==='en'?'Need an FOB quote for your next shipment?':'Cần báo giá FOB cho lô hàng tiếp theo?'}</h2>
              <p>{t.lang==='zh'
                ?'请发送粒径、数量和目的港信息 — 我们将在24个工作小时内回复,附规格表、COA和FOB价格。'
                :t.lang==='en'
                ?'Send us your particle size, volume and destination port — we reply within 24 business hours, with spec sheet, COA and FOB pricing.'
                :'Gửi yêu cầu kèm cỡ hạt, số lượng và cảng đến — chúng tôi phản hồi trong 24h làm việc, đính kèm spec, COA và báo giá FOB.'}</p>
            </div>
            <div className="pr-quote-r">
              <a className="pr-btn pr-btn-p" href="index.html#contact">
                {t.lang==='zh'?'请求报价':t.lang==='en'?'Request a quote':'Yêu cầu báo giá'}
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                     strokeLinejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </a>
              <a className="pr-btn pr-btn-g" href="about.html">
                {t.lang==='zh'?'关于龙英':t.lang==='en'?'About Long Anh':'Về Long Anh'}
              </a>
            </div>
          </div>
        </div>
      </section>

      <VAFooter tweaks={tweaks}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
