        </div>
      </div>
      <header className="vac-hd">

          <a className="vac-brand" href="index.html">

              <span>{C.tagline}</span>

            {C.nav.map((n,i)=>{
              if (NAV_SLUGS[i] === 'products') {

                      <a href="products.html#powder">

                        <span>{t.lang==='vi'?'Slab · Đá xẻ · Đá trang trí':'Slab · Cut tile · Decorative'}</span>
                      </a>

function VAPageHeader({ eyebrow, title, sub, breadcrumb }) {

    <section className="vac-pageheader">

          <div className="vac-bcrumb">

        <h1>{title}</h1>
        {sub && <p>{sub}</p>}
      </div>

  );

  .pr-card-spec{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--va-line);
    margin:20px -28px -28px;border-top:1px solid var(--va-line);}
  .pr-card-spec>div{background:var(--va-card);padding:16px 20px;}
  .pr-card-spec .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;margin-bottom:4px;}
  .pr-card-spec .val{font-size:13px;font-weight:600;font-family:ui-monospace,Menlo,monospace;}
  .pr-card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;}
  .pr-card-tags span{font-size:10.5px;padding:4px 10px;border-radius:99px;
    background:var(--va-bg-alt);opacity:.78;letter-spacing:.04em;font-weight:500;}
  .pr-sizes{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;
    margin-top:32px;padding-top:32px;border-top:1px solid var(--va-line);}
  .pr-size{background:var(--va-card);border:1px solid var(--va-line);border-radius:8px;
    padding:14px 10px;text-align:center;font-family:ui-monospace,Menlo,monospace;
    font-size:13px;font-weight:600;color:var(--brand-primary,#0F3D7A);transition:.2s;cursor:default;}
  .pr-size:hover{background:var(--brand-primary,#0F3D7A);color:#fff;border-color:var(--brand-primary,#0F3D7A);transform:translateY(-2px);}
  .pr.dark .pr-size{color:#5B9BD5;}
  .pr-spec-section{padding:96px 0;background:var(--va-bg-alt);}
  .pr-spec-head{text-align:center;margin-bottom:48px;max-width:680px;margin-inline:auto;}
  .pr-spec-head h2{font-size:clamp(30px,3.6vw,44px);}
  .pr-spec-table{background:var(--va-card);border:1px solid var(--va-line);border-radius:14px;overflow:hidden;}
  .pr-spec-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:0;border-bottom:1px solid var(--va-line);}
  .pr-spec-row:last-child{border-bottom:0;}
  .pr-spec-row.h{background:var(--va-bg-alt);font-size:11px;font-weight:600;
    letter-spacing:.08em;text-transform:uppercase;opacity:.7;}
  .pr-spec-row>div{padding:18px 24px;border-right:1px solid var(--va-line);font-size:13.5px;}
  .pr-spec-row>div:last-child{border-right:0;}
  .pr-spec-row>div:first-child{font-weight:600;}
  .pr-spec-row .num{font-family:ui-monospace,Menlo,monospace;color:var(--brand-accent,#F08023);}
  .pr-quote{background:#0F3D7A;color:#fff;border-radius:18px;padding:64px 56px;
    display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;margin:64px 0;}
  .pr-quote h2{color:#fff;font-size:clamp(28px,3.2vw,40px);margin-bottom:14px;}
  .pr-quote p{opacity:.78;line-height:1.65;font-size:15px;}
  .pr-quote-r{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;}
  .pr-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:8px;
    font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;border:0;font-family:inherit;transition:.18s;}
  .pr-btn-p{background:var(--brand-accent,#F08023);color:#fff;}
  .pr-btn-p:hover{background:#D26713;transform:translateY(-1px);}
  .pr-btn-g{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.3);}
  .pr-btn-g:hover{border-color:#fff;}
  @media (max-width:980px){
    .pr-grid{grid-template-columns:1fr;}.pr-cat-head{grid-template-columns:1fr;gap:18px;}
    .pr-sizes{grid-template-columns:repeat(4,1fr);}
    .pr-spec-row{grid-template-columns:1fr 1fr;}.pr-quote{grid-template-columns:1fr;}
  }
`;

const SIZES = {
  uncoated: ['5 µm','8 µm','10 µm','12 µm','15 µm','17 µm','18 µm','20 µm'],
  coated:   ['5 µm','10 µm','12 µm','15 µm','17 µm','18 µm','20 µm'],
};
const SPECS = {
  vi: {
    head: ['Chỉ tiêu','Bột không phủ','Bột phủ Stearic','Đơn vị'],
    rows: [
      ['Hàm lượng CaCO₃','≥ 98.5','≥ 98.5','%'],
      ['Độ trắng','≥ 96','≥ 96','%'],
      ['Độ ẩm','≤ 0.3','≤ 0.2','%'],
      ['Tỷ trọng đổ đống','0.9 – 1.1','0.7 – 0.9','g/cm³'],
      ['Hàm lượng Stearic','—','1.0 – 1.5','%'],
      ['Cỡ hạt D50','5 – 20','5 – 20','µm'],
    ],
  },
  en: {
    head: ['Property','Uncoated','Coated','Unit'],
    rows: [
      ['CaCO₃ content','≥ 98.5','≥ 98.5','%'],
      ['Whiteness','≥ 96','≥ 96','%'],
      ['Moisture','≤ 0.3','≤ 0.2','%'],
      ['Bulk density','0.9 – 1.1','0.7 – 0.9','g/cm³'],
      ['Stearic content','—','1.0 – 1.5','%'],
      ['Particle size D50','5 – 20','5 – 20','µm'],
    ],
  },
};

function App() {
  const [t, setT] = React.useState({ lang:'vi', dark:false, primary:'#0F3D7A', accent:'#F08023', font:'Inter' });
  const setTweak = (k, v) => setT(s => ({ ...s, [k]: v }));
  const tweaks = { ...t, set: setTweak };
  const C = COPY[t.lang];
  // Read URL hash to pre-set category: #powder → 0 (CaCO₃), #stone → 1 (natural stone)
  const initialCat = (() => {
    if (typeof window === 'undefined') return null;
    const h = window.location.hash;
    if (h === '#powder') return 0;
    if (h === '#stone') return 1;
    return null;
  })();
  const [activeCat, setActiveCat] = React.useState(initialCat);
  // Re-sync when hash changes (so clicking dropdown items on the same page works)
  React.useEffect(() => {
    const onHash = () => {
      const h = window.location.hash;
      if (h === '#powder') setActiveCat(0);
      else if (h === '#stone') setActiveCat(1);
      else setActiveCat(null);
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const cssVars = { '--brand-primary':t.primary, '--brand-accent':t.accent, '--va-font':t.font, '--va-display':t.font };
  const cats = C.catTitles;
  const filtered = activeCat===null ? C.products : C.products.filter(p => p.cat === activeCat);
  const byCat = [0,1].map(ci => ({
    title: cats[ci],
    products: filtered.filter(p => p.cat === ci),
  })).filter(g => g.products.length > 0);

  return (
    <div className={'vac pr '+(t.dark?'dark':'')} style={cssVars}>
      <style>{CHROME_CSS}</style>
      <style>{PR_CSS}</style>
      <VAHeader tweaks={tweaks} current="products"/>
      <VAPageHeader
        eyebrow={C.productsEy}
        title={t.lang==='vi'?'Hai dòng sản phẩm. Năm tiêu chuẩn.':'Two product lines. Five SKUs.'}
        sub={t.lang==='vi'
          ?'Từ bột đá CaCO₃ siêu mịn cho compound nhựa, đến đá tự nhiên cỡ lớn cho công trình cao cấp — tất cả đều đến từ một mỏ duy nhất.'
          :'From ultra-fine CaCO₃ for plastic compounds, to large-format natural stone for premium projects — all from a single quarry.'}
        breadcrumb={[
          { label: t.lang==='vi'?'Trang chủ':'Home', href:'index.html' },
          { label: C.nav[2] },
        ]}/>

      <section className="pr-section">
        <div className="pr-wrap">
          <div className="pr-cats">
            <button className={'pr-cat '+(activeCat===null?'on':'')} onClick={()=>setActiveCat(null)}>
              {t.lang==='vi'?'Tất cả':'All'}<span className="pr-cat-n">{C.products.length}</span>
            </button>
            {cats.map((title,i)=>{
              const cnt = C.products.filter(p=>p.cat===i).length;
              return (
                <button key={i} className={'pr-cat '+(activeCat===i?'on':'')} onClick={()=>setActiveCat(i)}>
                  {title}<span className="pr-cat-n">{cnt}</span>
                </button>
              );
            })}
          </div>

          {byCat.map((group, gi)=>(
            <div key={gi} className="pr-cat-block">
              <div className="pr-cat-head">
                <div>
                  <div className="pr-eyebrow">— 0{gi+1}</div>
                  <h2>{gi===0
                    ? (t.lang==='vi'?'Từ đá vôi nguyên sinh — đến bột mịn cho công nghiệp':'From raw limestone — to fine powder for industry')
                    : (t.lang==='vi'?'Đá tự nhiên — cho công trình và không gian sống':'Natural stone — for architecture and living spaces')}</h2>
                </div>
                <p>{gi===0
                  ? (t.lang==='vi'
                    ?'Sản phẩm bột đá CaCO₃ của chúng tôi được nghiền và chế biến từ nguồn đá vôi trắng nguyên sinh tại Quỳ Hợp — Nghệ An, độ trắng > 96% và hàm lượng CaCO₃ > 98.5%. Cỡ hạt từ 5 đến 20 µm, được sử dụng làm phụ gia trong sản xuất sơn nước, bột bả, keo dán, ống nhựa PVC, màng PE/PP, masterbatch, giấy, thức ăn chăn nuôi và nhiều ngành công nghiệp khác.'
                    :'Our CaCO₃ powder is milled from pristine white limestone at our Quy Hop quarry in Nghe An — whiteness above 96% and CaCO₃ content above 98.5%. Particle sizes range from 5 to 20 µm, used as an additive in water-based paint, putty, adhesives, PVC pipe, PE/PP film, masterbatch, paper, animal feed and many other industries.')
                  : (t.lang==='vi'
                    ?'Đá tự nhiên Long Anh được khai thác và chế biến trực tiếp tại mỏ — đảm bảo chất lượng đồng đều và nguồn cung ổn định. Sản phẩm bao gồm đá Slab tấm lớn cho mặt bàn và showroom cao cấp, đá xẻ quy cách cho ốp lát sàn tường công trình, và đá trang trí ngoại thất cho sân vườn, bể bơi, mặt tiền — với nhiều lựa chọn hoàn thiện bề mặt khác nhau.'
                    :'Long Anh natural stone is mined and processed in-house — ensuring consistent quality and reliable supply. Our range includes large-format Slab for premium countertops and showrooms, cut-to-size tile for floor and wall cladding, and decorative outdoor stone for gardens, pools and façades — with a variety of surface finishes available.')
                }</p>
              </div>

              <div className="pr-grid">
                {group.products.map((p,i)=>(
                  <article key={i} className="pr-card">
                    <div className="pr-card-img">
                      <img src={p.img} alt={p.name}/>
                      <div className="pr-card-badge">{p.code}</div>
                    </div>
                    <div className="pr-card-body">
                      <div className="pr-card-meta">{p.meta}</div>
                      <h3>{p.name}</h3>
                      <p>{p.desc}</p>
                      <div className="pr-card-tags">
                        {p.tags.map((tag,j)=><span key={j}>{tag}</span>)}
                      </div>
                      <div className="pr-card-spec">
                        <div>
                          <div className="lbl">{t.lang==='vi'?'Độ trắng':'Whiteness'}</div>
                          <div className="val">{p.cat===0?'≥ 96%':'90–95%'}</div>
                        </div>
                        <div>
                          <div className="lbl">{t.lang==='vi'?'Đóng gói':'Packaging'}</div>
                          <div className="val">{p.cat===0?'25kg / 1T':'Crate / pallet'}</div>
                        </div>
                      </div>
                    </div>
                  </article>
                ))}
              </div>

              {gi===0 && activeCat!==1 && (
                <>
                  <div style={{marginTop:48,marginBottom:14,fontSize:13,fontWeight:600,letterSpacing:'.04em',opacity:.7}}>
                    {t.lang==='vi'?'· Cỡ hạt khả dụng — Bột không phủ':'· Available sizes — Uncoated'}
                  </div>
                  <div className="pr-sizes">
                    {SIZES.uncoated.map(s => <div key={s} className="pr-size">{s}</div>)}
                  </div>
                  <div style={{marginTop:24,marginBottom:14,fontSize:13,fontWeight:600,letterSpacing:'.04em',opacity:.7}}>
                    {t.lang==='vi'?'· Cỡ hạt khả dụng — Bột phủ Stearic':'· Available sizes — Stearic-coated'}
                  </div>
                  <div className="pr-sizes">
                    {SIZES.coated.map(s => <div key={s} className="pr-size">{s}</div>)}
                  </div>
                </>
              )}
            </div>
          ))}
        </div>
      </section>

      {/* SPEC TABLE */}
      <section className="pr-spec-section">
        <div className="pr-wrap">
          <div className="pr-spec-head">
            <div className="pr-eyebrow">{t.lang==='vi'?'Thông số kỹ thuật':'Technical specifications'}</div>
            <h2>{t.lang==='vi'?'Chỉ tiêu chất lượng — Bột đá CaCO₃':'Quality specifications — CaCO₃ powder'}</h2>
          </div>
          <div className="pr-spec-table">
            <div className="pr-spec-row h">
              {SPECS[t.lang].head.map((h,i)=><div key={i}>{h}</div>)}
            </div>
            {SPECS[t.lang].rows.map((row,i)=>(
              <div key={i} className="pr-spec-row">
                <div>{row[0]}</div>
                <div className="num">{row[1]}</div>
                <div className="num">{row[2]}</div>
                <div style={{opacity:.6}}>{row[3]}</div>
              </div>
            ))}
          </div>
          <div style={{textAlign:'center',marginTop:24,fontSize:12,opacity:.55}}>
            {t.lang==='vi'?'Mỗi lô sản xuất đều kèm COA và MSDS. Có sẵn ISO 9001 : 2015.':'Each batch ships with COA and MSDS. ISO 9001 : 2015 certified.'}
          </div>
        </div>
      </section>

      {/* QUOTE CTA */}
      <div className="pr-wrap">
        <div className="pr-quote">
          <div>
            <div style={{fontSize:11,fontWeight:600,letterSpacing:'.16em',
                 textTransform:'uppercase',color:'#F08023',marginBottom:14}}>
              {t.lang==='vi'?'Báo giá nhanh':'Quick quote'}
            </div>
            <h2>{t.lang==='vi'?'Cần báo giá FOB cho lô hàng tiếp theo?':'Need an FOB quote for your next shipment?'}</h2>
            <p>{t.lang==='vi'
              ?'Gửi yêu cầu kèm cỡ hạt, số lượng và cảng đến — chúng tôi phản hồi trong 24h làm việc.'
              :'Send us your particle size, volume and destination port — we reply within 24 business hours.'}</p>
          </div>
          <div className="pr-quote-r">
            <a className="pr-btn pr-btn-p" href="index.html#contact">
              {t.lang==='vi'?'Yêu cầu báo giá':'Request a quote'} →
            </a>
            <a className="pr-btn pr-btn-g" href="about.html">
              {t.lang==='vi'?'Về Long Anh':'About Long Anh'}
            </a>
          </div>
        </div>
      </div>

      <VAFooter tweaks={tweaks}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
