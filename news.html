function fmtDate(iso, lang) {
  const [y,m,d] = iso.split('-');
  if (lang === 'en') {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
  }
  if (lang === 'zh') return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  return `${d}/${m}/${y}`;
}

function NewsPage({ tweaks }) {
  const t = tweaks;
  const C = COPY[t.lang];
  const [activeCat, setActiveCat] = React.useState('all');
  const [tab, setTab] = React.useState('latest');  // 'latest' | 'popular'

  const cssVars = { '--va-font':t.font, '--va-display':t.font };
  const filtered = activeCat === 'all' ? NEWS : NEWS.filter(n => n.cat === activeCat);

  // Sort by date (latest) or views (popular)
  const sortedByDate = [...NEWS].sort((a,b) => b.date.localeCompare(a.date));
  const sortedByViews = [...NEWS].sort((a,b) => b.views - a.views);
  const sidebarList = tab === 'latest' ? sortedByDate.slice(0,6) : sortedByViews.slice(0,6);

  // Hot topics — derive from most popular news titles' first 2-3 words
  const hotTopics = (t.lang === 'vi'
    ? ['Xuất khẩu', 'CaCO₃', 'ISO 9001', 'Báo giá tháng 5', 'Vietbuild 2026', 'Quỳ Hợp', '20 năm Long Anh']
    : t.lang === 'en'
    ? ['Export', 'CaCO₃', 'ISO 9001', 'May Pricing', 'Vietbuild 2026', 'Quy Hop', '20 Years']
    : ['出口', '碳酸钙', 'ISO 9001', '5月报价', '河内建筑展', '归合', '20周年']);

  // Filtered display
  const display = activeCat === 'all' ? filtered : filtered;
  const featured = display[0];
  const sub3 = display.slice(1, 4);
  const rest = display.slice(4);

  // Group remaining by category for bottom sections
  const byCat = {};
  NEWS.forEach(n => {
    if (!byCat[n.cat]) byCat[n.cat] = [];
    byCat[n.cat].push(n);
  });

  // Category subnav order
  const cats = ['all', 'business', 'milestone', 'tech', 'product', 'event', 'csr'];

  return (
    <div className={'vac nw '+(t.dark?'dark':'')} style={cssVars}>
      <style>{CHROME_CSS}</style>
      <style>{NW_CSS}</style>
      <VAHeader tweaks={tweaks} current="news"/>

      {/* PAGE HEADER (compact) */}
      <section className="nw-head">
        <div className="vac-wrap">
          <nav className="nw-bcrumb">
            <a href="index.html">{C.home}</a>
            <Icon name="chevron" size={11}/>
            <span className="now">{C.news}</span>
          </nav>
          <h1>{C.pageTitle}</h1>
        </div>
      </section>

      {/* SUBNAV: category chips */}
      <div className="nw-subnav">
        <div className="vac-wrap">
          <div className="nw-subnav-row">
            {cats.map(c => (
              <a key={c} className={activeCat===c?'on':''}
                 onClick={(e)=>{e.preventDefault(); setActiveCat(c);}}
                 href={'#'+c}>
                {c === 'all' ? C.filterAll : C.categories[c]}
              </a>
            ))}
          </div>
        </div>
      </div>

      {/* HOT TOPICS */}
      <div className="nw-hot">
        <div className="vac-wrap nw-hot-row">
          <div className="nw-hot-label">
            <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4-1 3 0 4 2 4 2 0 1-5 1-11z"/>
            </svg>
            {C.hotTopics}
          </div>
          <div className="nw-hot-tags">
            {hotTopics.map((h,i)=>(
              <a key={i} className="nw-hot-tag" href="#">{h}</a>
            ))}
          </div>
        </div>
      </div>

      {/* MAIN — featured + 3 sub + sidebar */}
      <section className="nw-main">
        <div className="vac-wrap">
          <div className="nw-main-grid">
            <div>
              {/* Featured article */}
              {featured && (
                <a className="nw-feat-card" href={'article.html?id='+featured.id}>
                  <div className="nw-feat-img">
                    <img src={featured.img} alt=""/>
                  </div>
                  <h2>{featured.title[t.lang]}</h2>
                  <p>{featured.excerpt[t.lang]}</p>
                  <div className="nw-feat-meta">
                    <b>{C.categories[featured.cat]}</b>
                    <span>·</span>
                    <span>{fmtDate(featured.date, t.lang)}</span>
                    <span>·</span>
                    <span>{featured.views.toLocaleString()} {C.viewCount}</span>
                    <span>·</span>
                    <span>{featured.comments} {C.commentCount}</span>
                  </div>
                </a>
              )}

              {/* 3 secondary cards */}
              {sub3.length > 0 && (
                <div className="nw-sub-grid">
                  {sub3.map(n => (
                    <a key={n.id} className="nw-sub-card" href={'article.html?id='+n.id}>
                      <div className="img"><img src={n.img} alt=""/></div>
                      <h3 style={{marginTop:12}}>{n.title[t.lang]}</h3>
                    </a>
                  ))}
                </div>
              )}

              {/* Rest of articles in list style */}
              {rest.length > 0 && (
                <>
                  <div className="nw-sec-head">
                    <h3>{C.sectionRecent}</h3>
                  </div>
                  <div className="nw-list">
                    {rest.map(n => (
                      <a key={n.id} className="nw-list-item" href={'article.html?id='+n.id}>
                        <div className="img"><img src={n.img} alt=""/></div>
                        <div className="body">
                          <span className="cat-pill">{C.categories[n.cat]}</span>
                          <h4>{n.title[t.lang]}</h4>
                          <p>{n.excerpt[t.lang]}</p>
                          <div className="meta">
                            <span>{fmtDate(n.date, t.lang)}</span>
                            <span className="sep">·</span>
                            <span>{n.views.toLocaleString()} {C.viewCount}</span>
                            <span className="sep">·</span>
                            <span>{n.comments} {C.commentCount}</span>
                          </div>
                        </div>
                      </a>
                    ))}
                  </div>
                </>
              )}
            </div>

            {/* Right sidebar */}
            <aside className="nw-side">
              <div className="nw-side-card">
                <div className="nw-tabs">
                  <button className={tab==='latest'?'on':''}
                    onClick={()=>setTab('latest')}>{C.tabLatest}</button>
                  <button className={tab==='popular'?'on':''}
                    onClick={()=>setTab('popular')}>{C.tabPopular}</button>
                </div>
                <div className="nw-side-list">
                  {sidebarList.map((n, i) => (
                    <a key={n.id} className="nw-side-item" href={'article.html?id='+n.id}>
                      <span className="nw-side-num">{String(i+1).padStart(2,'0')}</span>
                      <div>
                        <h5>{n.title[t.lang]}</h5>
                        <div className="when">
                          {fmtDate(n.date, t.lang)} · {n.views.toLocaleString()} {C.viewCount}
                        </div>
                      </div>
                    </a>
                  ))}
                </div>
              </div>

              {/* Compact newsletter */}
              <div className="nw-side-news">
                <h4>{C.newsletterTitle}</h4>
                <p>{C.newsletterBody}</p>
                <form onSubmit={(e)=>{e.preventDefault(); alert(t.lang==='vi'?'Cảm ơn bạn đã đăng ký!':t.lang==='zh'?'感谢您的订阅!':'Thanks for subscribing!');}}>
                  <input type="email" placeholder={C.emailPlaceholder} required/>
                  <button type="submit">{C.subscribe}</button>
                </form>
              </div>
            </aside>
          </div>
        </div>
      </section>

      {/* TIN THEO CHỦ ĐỀ — categorized sections */}
      <section className="nw-bycat" style={{background:'var(--va-bg-alt)'}}>
        <div className="vac-wrap">
          <div style={{marginBottom:32}}>
            <div style={{fontSize:11,fontWeight:700,letterSpacing:'.18em',
                 textTransform:'uppercase',color:'var(--brand-accent,#F08023)',marginBottom:8}}>
              {C.sectionByCat}
            </div>
            <h2 style={{fontSize:'clamp(22px,2.4vw,30px)'}}>
              {t.lang==='vi'?'Khám phá tin tức theo chủ đề':
               t.lang==='zh'?'按主题探索新闻':
               'Explore news by category'}
            </h2>
          </div>

          {/* Show top 2 categories */}
          {[
            ['business', 'milestone'],
            ['tech', 'product'],
          ].map((pair, row) => (
            <div key={row} className="nw-bycat-grid">
              {pair.map(catKey => {
                const items = (byCat[catKey] || []).slice(0,3);
                if (items.length === 0) return null;
                const feat = items[0];
                const others = items.slice(1);
                return (
                  <div key={catKey}>
                    <div className="nw-sec-head">
                      <h3>{C.categories[catKey]}</h3>
                      <a className="more" href="#" onClick={(e)=>{e.preventDefault(); setActiveCat(catKey);
                        window.scrollTo({top:0,behavior:'smooth'});}}>
                        {C.viewAll} →
                      </a>
                    </div>
                    <a className="nw-cat-feat" href={'article.html?id='+feat.id}>
                      <div className="img"><img src={feat.img} alt=""/></div>
                      <h3>{feat.title[t.lang]}</h3>
                      <p>{feat.excerpt[t.lang]}</p>
                      <div className="meta">{fmtDate(feat.date, t.lang)} · {feat.readMin} {C.minRead}</div>
                    </a>
                    {others.length > 0 && (
                      <div className="nw-list" style={{marginTop:16}}>
                        {others.map(n => (
                          <a key={n.id} className="nw-list-item" href={'article.html?id='+n.id}>
                            <div className="img"><img src={n.img} alt=""/></div>
                            <div className="body">
                              <h4>{n.title[t.lang]}</h4>
                              <div className="meta">
                                <span>{fmtDate(n.date, t.lang)}</span>
                                <span className="sep">·</span>
                                <span>{n.views.toLocaleString()} {C.viewCount}</span>
                              </div>
                            </div>
                          </a>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
        </div>
      </section>

      <VAFooter tweaks={tweaks}/>
    </div>
  );
}

function App() {
  const [t, setT] = React.useState({ lang:'vi', dark:false, font:'Inter' });
  const setTweak = (k, v) => setT(s => ({ ...s, [k]: v }));
  const tweaks = { ...t, set: setTweak };
  return <NewsPage tweaks={tweaks}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

      b.textContent=o.label;
      b.onclick=function(){handleQuick(o.key,o.label)};
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
    body.scrollTop=body.scrollHeight;
  }

  function addChannels(){
    var wrap=document.createElement('div');
    wrap.className='la-channels';
    wrap.innerHTML=
      '<a href="'+ZALO+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#0068ff"><path d="M12 2C6.48 2 2 5.94 2 10.8c0 2.81 1.5 5.3 3.83 6.9-.18.6-.65 2.2-.74 2.55-.11.43.16.43.34.31.14-.09 2.23-1.52 3.13-2.13.79.15 1.6.22 2.44.22 5.52 0 10-3.94 10-8.8S17.52 2 12 2z"/></svg> Zalo</a>'+
      '<a href="tel:'+PHONE+'"><svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Hotline</a>'+
      '<a href="mailto:'+EMAIL+'"><svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Email</a>'+
      '<a href="'+FB+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#1877f2"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg> Facebook</a>';
    body.appendChild(wrap);
    body.scrollTop=body.scrollHeight;
  }

  function handleQuick(key,label){
    addMsg(label,'user');
    setTimeout(function(){
      if(key==='price'){
        addMsg('Bảng giá thay đổi theo khối lượng và đặc tả kỹ thuật. Bạn vui lòng cho biết: <br>• Loại sản phẩm (Bột CaCO₃ / Đá ốp lát)<br>• Cỡ hạt / quy cách<br>• Khối lượng dự kiến<br>Hoặc gọi <b>0942 224 499</b> để nhận báo giá ngay.');
      }else if(key==='sample'){
        addMsg('Chúng tôi gửi mẫu MIỄN PHÍ trong nội địa. Bạn cho biết địa chỉ + loại mẫu cần thử, hoặc inbox Zalo <b>0942 224 499</b>.');
      }else if(key==='product'){
        addMsg('KS Long Anh có 2 dòng chính:<br>• <b>Bột đá CaCO₃</b> – siêu mịn, coated/uncoated, độ trắng ≥98%, cỡ hạt 3–20µm<br>• <b>Đá ốp lát tự nhiên</b> – slab, đá xẻ, đá chẻ, đá cuội<br>Xem chi tiết tại trang Sản phẩm.');
      }else if(key==='contact'){
        addChannels();
      }else{
        addMsg('Cảm ơn bạn! Đội kinh doanh sẽ phản hồi sớm nhất.');
      }
    },600);
  }

  function init(){
    addMsg('Xin chào! 👋 Tôi là trợ lý của <b>KS Long Anh</b>. Bạn cần tư vấn gì hôm nay?');
    setTimeout(function(){
      addQuick([
        {key:'price',label:'💰 Báo giá'},
        {key:'sample',label:'📦 Yêu cầu mẫu'},
        {key:'product',label:'🧱 Hỏi sản phẩm'},
        {key:'contact',label:'☎ Liên hệ trực tiếp'}
      ]);
    },500);
  }

  var opened=false;
  function open(){
    panel.classList.add('is-open');
    if(!opened){opened=true;init()}
    setTimeout(function(){input.focus()},200);
    try{sessionStorage.setItem('la_chat_opened','1')}catch(e){}
  }
  function close(){panel.classList.remove('is-open')}

  fab.addEventListener('click',function(){
    panel.classList.contains('is-open')?close():open();
  });
  closeBtn.addEventListener('click',close);

  // Tooltip on first visit
  try{
    if(!sessionStorage.getItem('la_chat_opened')){
      setTimeout(function(){fab.classList.add('show-tip')},1500);
      setTimeout(function(){fab.classList.remove('show-tip')},6500);
    }
  }catch(e){}

  function send(){
    var msg=input.value.trim();
    if(!msg)return;
    addMsg(msg.replace(/[<>]/g,function(c){return c==='<'?'&lt;':'&gt;'}),'user');
    input.value='';
    input.style.height='auto';
    setTimeout(function(){
      addMsg('Cảm ơn bạn đã nhắn! Để được hỗ trợ nhanh nhất, vui lòng liên hệ qua:');
      setTimeout(addChannels,400);
      setTimeout(function(){
        var subject=encodeURIComponent('Tư vấn từ website KS Long Anh');
        var bodyTxt=encodeURIComponent('Câu hỏi: '+msg+'\\n\\nTên:\\nSố điện thoại:\\nCông ty:');
        addMsg('Hoặc bạn có thể <a href="mailto:'+EMAIL+'?subject='+subject+'&body='+bodyTxt+'" style="color:#f97316;font-weight:600">gửi email với nội dung này</a>.');
      },1000);
    },700);
  }

  sendBtn.addEventListener('click',send);
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
  });
  input.addEventListener('input',function(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,80)+'px';
  });
})();
</script>
<!-- /KS Long Anh Live Chat Widget -->

</body>
</html>
