function fmtDate(iso, lang) {
  const [y,m,d] = iso.split('-');
  if (lang === 'en') {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
  }
  if (lang === 'zh') return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  return `${d}/${m}/${y}`;
}

function NewsPage({ tweaks }) {
  const t = tweaks;
  const C = COPY[t.lang];
  const [activeCat, setActiveCat] = React.useState('all');

  const cssVars = { '--va-font':t.font, '--va-display':t.font };
  const filtered = activeCat === 'all' ? NEWS : NEWS.filter(n => n.cat === activeCat);
  const featured = filtered[0];
  const rest = filtered.slice(1);

  // Get unique categories from NEWS
  const cats = ['all', ...Array.from(new Set(NEWS.map(n => n.cat)))];

  return (
    <div className={'vac nw '+(t.dark?'dark':'')} style={cssVars}>
      <style>{CHROME_CSS}</style>
      <style>{NW_CSS}</style>
      <VAHeader tweaks={tweaks} current="news"/>

      {/* PAGE HEADER */}
      <section className="nw-pageheader">
        <div className="vac-wrap">
          <nav className="nw-bcrumb">
            <a href="index.html">{C.home}</a>
            <Icon name="chevron" size={12}/>
            <span className="now">{C.news}</span>
          </nav>
          <div style={{marginTop:24}}>
            <div className="nw-eyebrow">{C.pageEyebrow}</div>
            <h1>{C.pageTitle}</h1>
            <p>{C.pageSub}</p>
          </div>
        </div>
      </section>

      {/* FILTERS */}
      <div className="nw-filters">
        <div className="vac-wrap nw-filters-row">
          {cats.map(c => (
            <button key={c}
              className={'nw-filter-btn'+(activeCat===c?' on':'')}
              onClick={()=>setActiveCat(c)}>
              {c === 'all' ? C.filterAll : C.categories[c]}
            </button>
          ))}
        </div>
      </div>

      {/* ARTICLES */}
      <section className="nw-section">
        <div className="vac-wrap">
          {featured && (
            <a className="nw-featured" href={'news.html#article-'+featured.id}>
              <div className="nw-featured-img">
                <img src={featured.img} alt=""/>
              </div>
              <div className="nw-featured-body">
                <div className="nw-featured-meta">
                  <span className="feat-tag">★ {C.featured}</span>
                  <span className="cat">{C.categories[featured.cat]}</span>
                  <span className="date">{fmtDate(featured.date, t.lang)}</span>
                  <span className="sep">·</span>
                  <span className="date">{featured.readMin} {C.minRead}</span>
                </div>
                <h2>{featured.title[t.lang]}</h2>
                <p>{featured.excerpt[t.lang]}</p>
                <span className="nw-readmore">
                  {C.readMore} <Icon name="arrow" size={14}/>
                </span>
              </div>
            </a>
          )}

          <div className="nw-grid">
            {rest.map(n => (
              <a key={n.id} className="nw-card" href={'news.html#article-'+n.id}>
                <div className="nw-card-img">

                  <span className="nw-card-cat">{C.categories[n.cat]}</span>
                </div>

                  <div className="nw-card-meta">
                    <span><Icon name="cal" size={11} style={{verticalAlign:'middle',marginRight:4}}/>
                      {fmtDate(n.date, t.lang)}</span>
                    <span className="sep">·</span>
                    <span><Icon name="clock" size={11} style={{verticalAlign:'middle',marginRight:4}}/>
                      {n.readMin} {C.minRead}</span>
                  </div>

                  <p>{n.excerpt[t.lang]}</p>

                    <span style={{opacity:.5}}>#{String(n.id).padStart(3,'0')}</span>

                  </div>
                </div>
              </a>
            ))}

        </div>
      </section>

      {/* NEWSLETTER CTA */}

        <div className="vac-wrap">
          <div className="nw-newsletter">

function App() {
  const [t, setT] = React.useState({ lang:'vi', dark:false, font:'Inter' });
  const setTweak = (k, v) => setT(s => ({ ...s, [k]: v }));
  const tweaks = { ...t, set: setTweak };
  return <NewsPage tweaks={tweaks}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
