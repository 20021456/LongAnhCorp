function ProductDetailPage({ tweaks, code }) {
  const t = tweaks;
  const C = COPY[t.lang];
  const product = PRODUCTS[code];
  const [activeImg, setActiveImg] = React.useState(0);

  if (!product) {
    return (
      <div className={'vac pd '+(t.dark?'dark':'')}>
        <style>{CHROME_CSS}</style>
        <style>{PD_CSS}</style>
        <VAHeader tweaks={tweaks} current="products"/>
        <div className="vac-wrap" style={{padding:'120px 32px',textAlign:'center'}}>
          <h2>{C.notFound}</h2>
          <p style={{margin:'20px 0',opacity:.7}}>Code: {code}</p>
          <a href="products.html" className="pd-cta-btn primary" style={{display:'inline-flex'}}>
            ← {C.backToProducts}
          </a>
        </div>
        <VAFooter tweaks={tweaks}/>
      </div>
    );
  }

  const cssVars = { '--va-font':t.font, '--va-display':t.font };
  const isPowder = product.cat === 0;
  const productName = product.name[t.lang] || product.name.vi;
  const categoryName = C.catTitles[product.cat];

  // Related products: other products in same category
  const related = Object.values(PRODUCTS)
    .filter(p => p.code !== code && p.cat === product.cat)
    .concat(Object.values(PRODUCTS).filter(p => p.cat !== product.cat).slice(0,2))
    .slice(0,3);

  return (
    <div className={'vac pd '+(t.dark?'dark':'')} style={cssVars}>
      <style>{CHROME_CSS}</style>
      <style>{PD_CSS}</style>
      <VAHeader tweaks={tweaks} current="products"/>

      {/* HERO: gallery + info panel */}
      <section className="pd-hero">
        <div className="vac-wrap">
          <nav className="pd-bcrumb">
            <a href="index.html">{C.home}</a>
            <Icon name="chevron" size={12}/>
            <a href="products.html">{C.products}</a>
            <Icon name="chevron" size={12}/>
            <span className="now">{product.code} · {productName}</span>
          </nav>

          <div className="pd-hero-grid" style={{marginTop:24}}>
            <div className="pd-gallery">
              <div className="pd-gallery-main">
                <img src={product.images[activeImg]} alt={productName} key={activeImg}/>
                <div className="pd-gallery-badge">{product.code}</div>
                <div className="pd-gallery-cat">{categoryName}</div>
              </div>
              <div className="pd-gallery-thumbs">
                {product.images.map((img, i) => (
                  <div key={i} className={'pd-gallery-thumb'+(i===activeImg?' on':'')}
                       onClick={()=>setActiveImg(i)}>
                    <img src={img} alt=""/>
                  </div>
                ))}
              </div>
            </div>

            <div className="pd-info">
              <div className="pd-info-meta">
                <span className="pd-info-meta-chip brand">{product.code}</span>
                <span className="pd-info-meta-chip cat">{categoryName}</span>
                <span className="pd-info-meta-chip stock">
                  <Icon name="check" size={11}/> {C.inStock}
                </span>
              </div>
              <h1>{productName}</h1>
              <div className="pd-info-sub">{product.meta[t.lang]}</div>
              <p className="pd-info-desc">{product.desc[t.lang]}</p>

              <div className="pd-quick">
                {product.specs.slice(0,4).map((s,i) => (
                  <div key={i} className="pd-quick-cell">
                    <div className="lbl">{C['spec_'+s.key] || s.key}</div>
                    <div className={'val'+(i===0||i===1?' accent':'')}>{s.val}{s.unit?' '+s.unit:''}</div>
                  </div>
                ))}
              </div>

              <div className="pd-features">
                <div className="pd-features-title">{C.keyFeatures}</div>
                <ul>
                  {product.features[t.lang].map((f,i) => (
                    <li key={i}><Icon name="check" size={16}/><span>{f}</span></li>
                  ))}
                </ul>
              </div>

              <div className="pd-tags">
                {product.tags[t.lang].map((tag,i) => <span key={i}>{tag}</span>)}
              </div>

              <div className="pd-cta-box">
                <div className="pd-cta-box-title">
                  {t.lang==='vi'?'Quan tâm sản phẩm này?'
                    :t.lang==='zh'?'对该产品感兴趣?'
                    :'Interested in this product?'}
                </div>
                <div className="pd-cta-box-row">
                  <a className="pd-cta-btn primary" href={'index.html#contact?code='+product.code}>
                    <Icon name="mail" size={16}/> {C.requestQuote}
                  </a>
                  <a className="pd-cta-btn secondary" href={'tel:'+C.phone[0].replace(/[^+\d]/g,'')}>
                    <Icon name="phone" size={16}/> {C.phone[0]}
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* DETAILED DESCRIPTION */}
      <section className="pd-section alt">
        <div className="vac-wrap">
          <div className="pd-section-head">
            <div className="ix"><Icon name="badge" size={20}/></div>
            <div>
              <div className="num">— 01 · {C.overview}</div>
              <h2>{C.descTitle}</h2>
            </div>
          </div>
          <div className="pd-longdesc">
            <div>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:'.16em',
                   textTransform:'uppercase',color:'var(--brand-accent,#F08023)',marginBottom:10}}>
                {productName}
              </div>
              <div style={{fontSize:14,opacity:.6,lineHeight:1.6}}>
                {C.code}: <b style={{color:'var(--brand-primary,#0F3D7A)',
                  fontFamily:'ui-monospace,Menlo,monospace'}}>{product.code}</b>
                <br/>{C.category}: <b>{categoryName}</b>
                <br/>{C.moq}: <b>{product.moq[t.lang]}</b>
                <br/>{C.leadTime}: <b>{product.leadTime[t.lang]}</b>
              </div>
            </div>
            <p>{product.longDesc[t.lang]}</p>
          </div>
        </div>
      </section>

      {/* TECHNICAL SPECS */}
      <section className="pd-section">
        <div className="vac-wrap">
          <div className="pd-section-head">
            <div className="ix"><Icon name="grid" size={20}/></div>
            <div>
              <div className="num">— 02 · {C.technicalSpecs}</div>
              <h2>{C.technicalSpecs}</h2>
            </div>
          </div>
          <div className="pd-spec-card">
            <div className="pd-spec-row h">
              <div>{t.lang==='vi'?'Chỉ tiêu':t.lang==='zh'?'指标':'Property'}</div>
              <div>{t.lang==='vi'?'Giá trị':t.lang==='zh'?'数值':'Value'}</div>
              <div>{t.lang==='vi'?'Đơn vị':t.lang==='zh'?'单位':'Unit'}</div>
            </div>
            {product.specs.map((s,i) => (
              <div key={i} className="pd-spec-row">
                <div className="label">{C['spec_'+s.key] || s.key}</div>
                <div className="val">{s.val}</div>
                <div className="unit">{s.unit || '—'}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* SIZES */}
      <section className="pd-section alt">
        <div className="vac-wrap">
          <div className="pd-section-head">
            <div className="ix"><Icon name="box" size={20}/></div>
            <div>
              <div className="num">— 03 · {isPowder ? C.sizes : C.dimensions}</div>
              <h2>{isPowder ? (t.lang==='vi'?'Cỡ hạt khả dụng':t.lang==='zh'?'可用粒径':'Available particle sizes')
                            : (t.lang==='vi'?'Kích thước & quy cách':t.lang==='zh'?'尺寸和规格':'Sizes & formats')}</h2>
            </div>
          </div>
          {isPowder ? (
            <div className="pd-sizes-grid">
              {product.sizes.map(s => {
                const dotSize = 36 + (s - 5) * 3.6;
                return (
                  <div key={s} className="pd-size-cell">
                    <div className="pd-size-dot" style={{width:dotSize,height:dotSize}}>{s}</div>
                    <div className="pd-size-label">{s} {product.sizesUnit}</div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="pd-sizes-chips">
              {product.sizes.map(s => <span key={s}>{s}</span>)}
            </div>
          )}
        </div>
      </section>

      {/* APPLICATIONS */}
      <section className="pd-section">
        <div className="vac-wrap">
          <div className="pd-section-head">
            <div className="ix"><Icon name="spark" size={20}/></div>
            <div>
              <div className="num">— 04 · {C.applications}</div>
              <h2>{t.lang==='vi'?'Ứng dụng tiêu biểu':t.lang==='zh'?'典型应用':'Typical applications'}</h2>
            </div>
          </div>
          <div className="pd-apps-grid">
            {product.applications.map((app,i) => (
              <div key={i} className="pd-app">
                <div className="pd-app-i"><Icon name={app.icon} size={26}/></div>
                <h4>{app[t.lang]}</h4>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* PACKAGING */}
      <section className="pd-section alt">
        <div className="vac-wrap">
          <div className="pd-section-head">
            <div className="ix"><Icon name="box" size={20}/></div>
            <div>
              <div className="num">— 05 · {C.packaging}</div>
              <h2>{t.lang==='vi'?'Quy cách đóng gói':t.lang==='zh'?'包装规格':'Packaging options'}</h2>
            </div>
          </div>
          <div className="pd-pack-grid">
            {product.packaging.map((pk,i) => (
              <div key={i} className="pd-pack-card">
                <div className="pd-pack-icon"><Icon name="box" size={20}/></div>
                <span>{pk[t.lang]}</span>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* RELATED PRODUCTS */}
      <section className="pd-section">
        <div className="vac-wrap">
          <div className="pd-section-head">
            <div className="ix"><Icon name="grid" size={20}/></div>
            <div>
              <div className="num">— 06 · {C.relatedProducts}</div>
              <h2>{C.relatedProducts}</h2>
            </div>
          </div>
          <div className="pd-related-grid">
            {related.map(r => (
              <a key={r.code} href={'product.html?code='+r.code} className="pd-related-card">
                <div className="pd-related-img">
                  <img src={r.images[0]} alt=""/>
                </div>
                <div className="pd-related-body">
                  <div className="meta">{r.code} · {r.meta[t.lang]}</div>
                  <h4>{r.name[t.lang]}</h4>
                </div>
              </a>
            ))}
          </div>
        </div>
      </section>

      {/* QUOTE CTA */}
      <section className="pd-section">
        <div className="vac-wrap">
          <div className="pd-quote">
            <div>
              <div style={{fontSize:11,fontWeight:700,letterSpacing:'.16em',
                   textTransform:'uppercase',color:'var(--brand-accent,#F08023)',marginBottom:14}}>
                {t.lang==='vi'?'Yêu cầu báo giá':t.lang==='zh'?'请求报价':'Request a quote'}
              </div>
              <h2>{t.lang==='vi'?`Cần báo giá ${product.code} cho lô hàng tiếp theo?`
                    :t.lang==='zh'?`需要 ${product.code} 的下次发货报价?`
                    :`Need a ${product.code} quote for your next shipment?`}</h2>
              <p style={{marginTop:14}}>{t.lang==='vi'
                ?'Gửi yêu cầu kèm số lượng và cảng đến — chúng tôi phản hồi trong 24h làm việc với spec sheet, COA và FOB pricing.'
                :t.lang==='zh'
                ?'发送数量和目的港信息 — 我们将在24个工作小时内回复,附规格表、COA和FOB价格。'
                :'Send quantity and destination port — we reply within 24 business hours with spec sheet, COA and FOB pricing.'}</p>
            </div>
            <div className="pd-quote-r">
              <a className="pd-cta-btn primary" href={'index.html#contact?code='+product.code}>
                <Icon name="arrow" size={15}/> {C.sendInquiry}
              </a>
              <a className="pd-cta-btn secondary" href={'mailto:'+C.email+'?subject=Inquiry: '+product.code}>
                <Icon name="mail" size={15}/> {C.email}
              </a>
            </div>
          </div>
        </div>
      </section>

      <VAFooter tweaks={tweaks}/>
    </div>
  );
}

function App() {
  const [t, setT] = React.useState({ lang:'vi', dark:false, font:'Inter' });
  const setTweak = (k, v) => setT(s => ({ ...s, [k]: v }));
  const tweaks = { ...t, set: setTweak };

  // Read URL param ?code=P-XX
  const params = new URLSearchParams(typeof window !== 'undefined' ? window.location.search : '');
  const code = (params.get('code') || 'P-01').toUpperCase();

  return <ProductDetailPage tweaks={tweaks} code={code}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
