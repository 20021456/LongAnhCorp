      en:'From a single white limestone quarry to North-Central Vietnam\'s leading powder manufacturer with 350,000 t/y and 12 export markets — a 20-year journey.',

    },
    body:{
      vi:[
        'Ngày 22/03/2026, tại Trung tâm Hội nghị Mường Thanh Vinh, KS Long Anh long trọng tổ chức lễ kỷ niệm 20 năm thành lập (2006-2026) với sự tham dự của hơn 800 đại biểu: lãnh đạo tỉnh Nghệ An, đối tác khách hàng quốc tế, nhân viên và gia đình của 5 nhà máy.',
        'Khởi nguồn năm 2006 từ một mỏ đá vôi trắng nhỏ tại Quỳ Hợp với 12 nhân viên, sau 20 năm Long Anh đã phát triển thành tập đoàn khoáng sản hàng đầu Bắc Trung Bộ: 5 mỏ đá vận hành, 5 nhà máy chế biến với tổng công suất 350,000 tấn/năm, hơn 150 nhân viên, và xuất khẩu đến 12 quốc gia trên 3 châu lục.',
        'Trong bài phát biểu kỷ niệm, Chủ tịch HĐQT Nguyễn Long Anh nhấn mạnh: "20 năm là một hành trình dài. Chúng tôi không chỉ tự hào về những con số kinh doanh, mà còn về việc tạo công ăn việc làm ổn định cho hàng trăm gia đình ở Quỳ Hợp, đóng góp vào ngân sách tỉnh, và đặt nền móng cho ngành công nghiệp khoáng sản chế biến sâu của Nghệ An."',
        'Các cột mốc đáng nhớ của Long Anh: 2008 thành lập chính thức · 2013 dây chuyền nghiền khô đầu tiên · 2017 dây chuyền phủ Stearic Acid · 2020 đạt ISO 9001:2015 · 2022 đạt REACH (EU) · 2024 khánh thành xưởng Slab 1.6×2.4m · 2026 dây chuyền nghiền siêu mịn số 4 và mở rộng thị trường Trung Đông.',
        'Tại lễ kỷ niệm, Long Anh công bố Quỹ Học bổng Long Anh 5 tỷ đồng cho sinh viên ngành kỹ thuật khoáng sản, hóa, vật liệu tại các trường ĐH Bách Khoa Hà Nội, ĐH Vinh, ĐH Mỏ Địa Chất giai đoạn 2026–2030. Mỗi năm 100 suất học bổng, mỗi suất 10 triệu đồng.',
        'Kế hoạch 5 năm tới (2026–2030): tăng công suất lên 500,000 tấn/năm, mở rộng đến 20 thị trường xuất khẩu, đầu tư R&D cho dòng sản phẩm CaCO₃ phủ silane và bột nano. Doanh thu mục tiêu 1,000 tỷ đồng vào năm 2030 — gấp 3,5 lần năm 2025.',

      en:[
        'On March 22, 2026, at Muong Thanh Vinh Conference Center, KS Long Anh solemnly held its 20th anniversary celebration (2006-2026) with over 800 attendees: Nghe An provincial leaders, international customer partners, employees and families from 5 plants.',
        'Founded in 2006 from a small white limestone quarry in Quy Hop with 12 employees, after 20 years Long Anh has grown into North-Central Vietnam\'s leading mineral group: 5 operating quarries, 5 processing plants with total capacity 350,000 tons/year, over 150 employees, and exports to 12 countries across 3 continents.',

        'Long Anh\'s memorable milestones: 2008 official establishment · 2013 first dry-grinding line · 2017 Stearic Acid coating line · 2020 ISO 9001:2015 · 2022 REACH (EU) certification · 2024 1.6×2.4m Slab workshop opening · 2026 ultra-fine grinding line #4 and Middle East market expansion.',
        'At the celebration, Long Anh announced the 5 billion VND Long Anh Scholarship Fund for students in mineral, chemical and materials engineering at Hanoi University of Science and Technology, Vinh University, and University of Mining and Geology for 2026–2030. 100 scholarships per year, 10 million VND each.',
        '5-year plan (2026–2030): increase capacity to 500,000 tons/year, expand to 20 export markets, invest in R&D for silane-coated CaCO₃ and nano powder. Revenue target: 1,000 billion VND by 2030 — 3.5× of 2025.',
      ],
      zh:[
        '2026年3月22日,在荣市Muong Thanh会议中心,龙英矿业隆重举行20周年庆典(2006-2026),超过800名嘉宾出席:义安省领导人、国际客户合作伙伴、5家工厂的员工和家属。',
        '龙英始建于2006年,从归合的一个小型白石灰岩矿场起步,有12名员工。20年后,龙英已成长为越南北中部领先的矿业集团:5个运营矿场、5个加工厂总产能35万吨/年、150多名员工,出口到3大洲12个国家。',
        '在周年纪念演讲中,董事长阮龙英强调:"20年是一段漫长的旅程。我们不仅为业务数字感到自豪,还为在归合为数百个家庭创造稳定的工作、为省预算做出贡献、为义安省的深矿产加工行业奠定基础感到自豪。"',

        '在庆典上,龙英宣布2026-2030年期间向河内科学技术大学、荣大学和矿业与地质大学的矿物、化学和材料工程专业学生提供50亿越南盾的龙英奖学金基金。每年100个奖学金,每个1000万越南盾。',
        '5年计划(2026-2030):产能提升至50万吨/年,扩展到20个出口市场,投资硬脂酸硅烷涂层碳酸钙和纳米粉末的研发。到2030年收入目标:1000亿越南盾 — 是2025年的3.5倍。',

        'Mỗi suất học bổng trị giá 10 triệu đồng, được trao cho học sinh có hoàn cảnh khó khăn nhưng đạt thành tích học tập xuất sắc (HSG cấp tỉnh trở lên hoặc điểm trung bình ≥ 9.0). Mỗi trường nhận 10 suất, lựa chọn qua hội đồng xét duyệt gồm đại diện nhà trường, phụ huynh và Long Anh.',

function fmtDate(iso, lang) {
  const [y,m,d] = iso.split('-');
  if (lang === 'en') {
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[parseInt(m)-1]} ${parseInt(d)}, ${y}`;
  }
  if (lang === 'zh') return `${y}年${parseInt(m)}月${parseInt(d)}日`;
  return `${d}/${m}/${y}`;
}

                  <a className="ar-share-btn" href={'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent('https://20021456.github.io/LongAnhCorp/article.html?id='+article.id)} target="_blank" rel="noopener" aria-label="Facebook">
                    <svg viewBox="0 0 24 24"><path d="M9.198 21.5h4v-8.01h3.604l.396-3.98h-4V7.5a1 1 0 0 1 1-1h3v-4h-3a5 5 0 0 0-5 5v2.01h-2l-.396 3.98h2.396v8.01z"/></svg>
                  </a>
                  <a className="ar-share-btn" href={'https://twitter.com/intent/tweet?text='+encodeURIComponent(title)+'&url='+encodeURIComponent('https://20021456.github.io/LongAnhCorp/article.html?id='+article.id)} target="_blank" rel="noopener" aria-label="X">
                    <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231zm-1.161 17.52h1.833L7.084 4.126H5.117l11.966 15.644z"/></svg>
                  </a>
                  <a className="ar-share-btn" href={'https://www.linkedin.com/shareArticle?mini=true&url='+encodeURIComponent('https://20021456.github.io/LongAnhCorp/article.html?id='+article.id)+'&title='+encodeURIComponent(title)} target="_blank" rel="noopener" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43c-1.14 0-2.07-.93-2.07-2.07s.93-2.07 2.07-2.07 2.07.93 2.07 2.07-.93 2.07-2.07 2.07zm1.78 13.02H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.55C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
                  </a>
                  <a className="ar-share-btn" href={'mailto:?subject='+encodeURIComponent(title)+'&body='+encodeURIComponent('https://20021456.github.io/LongAnhCorp/article.html?id='+article.id)} aria-label="Email">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                  </a>
                </div>
              </div>
              <a className="ar-back" href="news.html">
                <Icon name="arrow" size={15} style={{transform:'rotate(180deg)'}}/> {C.backToList}
              </a>
            </div>
          </div>
        </div>
      </section>

      {/* RELATED */}
      <section className="ar-related">
        <div className="vac-wrap">
          <div className="ar-related-head">
            <h2>{C.relatedTitle}</h2>
            <a href="news.html">{C.backToList} →</a>
          </div>
          <div className="ar-related-grid">
            {related.map(r => (
              <a key={r.id} className="ar-rel-card" href={'article.html?id='+r.id}>
                <div className="ar-rel-img"><img src={r.img} alt=""/></div>
                <div className="ar-rel-body">
                  <div className="ar-rel-cat">{C.categories[r.cat]}</div>
                  <h4>{r.title[t.lang]}</h4>
                  <div className="meta">
                    {fmtDate(r.date, t.lang)} · {r.views.toLocaleString()} {C.viewCount}
                  </div>
                </div>
              </a>
            ))}
          </div>
        </div>
      </section>

      <VAFooter tweaks={tweaks}/>
    </div>
  );
}

function App() {
  const [t, setT] = React.useState({ lang:'vi', dark:false, font:'Inter' });
  const setTweak = (k, v) => setT(s => ({ ...s, [k]: v }));
  const tweaks = { ...t, set: setTweak };

  const params = new URLSearchParams(typeof window !== 'undefined' ? window.location.search : '');
  const id = params.get('id') || '1';

  return <ArticlePage tweaks={tweaks} id={id}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

  .la-msg.bot{background:#fff;color:#0f172a;border:1px solid #e2e8f0;align-self:flex-start;border-bottom-left-radius:4px}

  .la-chat-input textarea{flex:1;border:1px solid #e2e8f0;border-radius:18px;padding:9px 14px;font-size:13.5px;font-family:inherit;resize:none;outline:none;max-height:80px;min-height:38px;line-height:1.4;transition:border-color .15s}

  .la-chat-send:hover{background:#ea580c}
  .la-chat-send:disabled{background:#cbd5e1;cursor:not-allowed}
  .la-chat-foot{padding:6px 12px;text-align:center;font-size:10.5px;color:#94a3b8;background:#fff;border-top:1px solid #f1f5f9}
  @media (max-width:480px){
    #la-chat-panel{right:8px;left:8px;width:auto;bottom:84px;height:calc(100vh - 100px)}

<div id="la-chat-panel" role="dialog" aria-label="Khung chat tư vấn">
  <div class="la-chat-head">
    <div class="la-chat-avatar">LA</div>
    <div class="la-chat-title">
      <h4>KS Long Anh</h4>
      <p>Tư vấn trực tuyến • Sẵn sàng hỗ trợ</p>
    </div>
    <button class="la-chat-close" aria-label="Đóng">×</button>
  </div>
  <div class="la-chat-body" id="la-chat-body"></div>
  <div class="la-chat-input">
    <textarea id="la-chat-text" rows="1" placeholder="Nhập câu hỏi của bạn..."></textarea>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <div class="la-chat-foot">Phản hồi trong vòng 5–15 phút (giờ làm việc)</div>
</div>
<script>
(function(){
  var EMAIL='info@longanhcorp.com';
  var PHONE='+84942224499';
  var ZALO='https://zalo.me/longanhcorp';
  var FB='https://www.facebook.com/longanhcorp';

  var fab=document.getElementById('la-chat-fab');
  var panel=document.getElementById('la-chat-panel');
  var closeBtn=panel.querySelector('.la-chat-close');
  var body=document.getElementById('la-chat-body');
  var input=document.getElementById('la-chat-text');
  var sendBtn=document.getElementById('la-chat-send');

  function time(){var d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}

  function addMsg(html,who){
    var el=document.createElement('div');
    el.className='la-msg '+(who||'bot');
    el.innerHTML=html+'<span class="la-msg-time">'+time()+'</span>';
    body.appendChild(el);
    body.scrollTop=body.scrollHeight;
    return el;
  }

  function addQuick(opts){
    var wrap=document.createElement('div');
    wrap.className='la-quick';
    opts.forEach(function(o){
      var b=document.createElement('button');
      b.textContent=o.label;
      b.onclick=function(){handleQuick(o.key,o.label)};
      wrap.appendChild(b);
    });
    body.appendChild(wrap);
    body.scrollTop=body.scrollHeight;
  }

  function addChannels(){
    var wrap=document.createElement('div');
    wrap.className='la-channels';
    wrap.innerHTML=
      '<a href="'+ZALO+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#0068ff"><path d="M12 2C6.48 2 2 5.94 2 10.8c0 2.81 1.5 5.3 3.83 6.9-.18.6-.65 2.2-.74 2.55-.11.43.16.43.34.31.14-.09 2.23-1.52 3.13-2.13.79.15 1.6.22 2.44.22 5.52 0 10-3.94 10-8.8S17.52 2 12 2z"/></svg> Zalo</a>'+
      '<a href="tel:'+PHONE+'"><svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Hotline</a>'+
      '<a href="mailto:'+EMAIL+'"><svg viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> Email</a>'+
      '<a href="'+FB+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="#1877f2"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z"/></svg> Facebook</a>';
    body.appendChild(wrap);
    body.scrollTop=body.scrollHeight;
  }

  function handleQuick(key,label){
    addMsg(label,'user');
    setTimeout(function(){
      if(key==='price'){
        addMsg('Bảng giá thay đổi theo khối lượng và đặc tả kỹ thuật. Bạn vui lòng cho biết: <br>• Loại sản phẩm (Bột CaCO₃ / Đá ốp lát)<br>• Cỡ hạt / quy cách<br>• Khối lượng dự kiến<br>Hoặc gọi <b>0942 224 499</b> để nhận báo giá ngay.');
      }else if(key==='sample'){
        addMsg('Chúng tôi gửi mẫu MIỄN PHÍ trong nội địa. Bạn cho biết địa chỉ + loại mẫu cần thử, hoặc inbox Zalo <b>0942 224 499</b>.');
      }else if(key==='product'){
        addMsg('KS Long Anh có 2 dòng chính:<br>• <b>Bột đá CaCO₃</b> – siêu mịn, coated/uncoated, độ trắng ≥98%, cỡ hạt 3–20µm<br>• <b>Đá ốp lát tự nhiên</b> – slab, đá xẻ, đá chẻ, đá cuội<br>Xem chi tiết tại trang Sản phẩm.');
      }else if(key==='contact'){
        addChannels();
      }else{
        addMsg('Cảm ơn bạn! Đội kinh doanh sẽ phản hồi sớm nhất.');
      }
    },600);
  }

  function init(){
    addMsg('Xin chào! 👋 Tôi là trợ lý của <b>KS Long Anh</b>. Bạn cần tư vấn gì hôm nay?');
    setTimeout(function(){
      addQuick([
        {key:'price',label:'💰 Báo giá'},
        {key:'sample',label:'📦 Yêu cầu mẫu'},
        {key:'product',label:'🧱 Hỏi sản phẩm'},
        {key:'contact',label:'☎ Liên hệ trực tiếp'}
      ]);
    },500);
  }

  var opened=false;
  function open(){
    panel.classList.add('is-open');
    if(!opened){opened=true;init()}
    setTimeout(function(){input.focus()},200);
    try{sessionStorage.setItem('la_chat_opened','1')}catch(e){}
  }
  function close(){panel.classList.remove('is-open')}

  fab.addEventListener('click',function(){
    panel.classList.contains('is-open')?close():open();
  });
  closeBtn.addEventListener('click',close);

  // Tooltip on first visit
  try{
    if(!sessionStorage.getItem('la_chat_opened')){
      setTimeout(function(){fab.classList.add('show-tip')},1500);
      setTimeout(function(){fab.classList.remove('show-tip')},6500);
    }
  }catch(e){}

  function send(){
    var msg=input.value.trim();
    if(!msg)return;
    addMsg(msg.replace(/[<>]/g,function(c){return c==='<'?'&lt;':'&gt;'}),'user');
    input.value='';
    input.style.height='auto';
    setTimeout(function(){
      addMsg('Cảm ơn bạn đã nhắn! Để được hỗ trợ nhanh nhất, vui lòng liên hệ qua:');
      setTimeout(addChannels,400);
      setTimeout(function(){
        var subject=encodeURIComponent('Tư vấn từ website KS Long Anh');
        var bodyTxt=encodeURIComponent('Câu hỏi: '+msg+'\\n\\nTên:\\nSố điện thoại:\\nCông ty:');
        addMsg('Hoặc bạn có thể <a href="mailto:'+EMAIL+'?subject='+subject+'&body='+bodyTxt+'" style="color:#f97316;font-weight:600">gửi email với nội dung này</a>.');
      },1000);
    },700);
  }

  sendBtn.addEventListener('click',send);
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
  });
  input.addEventListener('input',function(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,80)+'px';
  });
})();
</script>
<!-- /KS Long Anh Live Chat Widget -->
